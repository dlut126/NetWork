// ---------- Import / export ----------
function csvCell(v){ v = String(v ?? ""); return /[",\n\r]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }
function parseCSV(text){
  const rows = []; let row = [], cell = "", q = false;
  text = text.replace(/^﻿/, "");
  for (let i = 0; i < text.length; i++){
    const ch = text[i];
    if (q){
      if (ch === '"'){ if (text[i+1] === '"'){ cell += '"'; i++; } else q = false; }
      else cell += ch;
    } else if (ch === '"') q = true;
    else if (ch === ","){ row.push(cell); cell = ""; }
    else if (ch === "\n" || ch === "\r"){ if (ch === "\r" && text[i+1] === "\n") i++; row.push(cell); rows.push(row); row = []; cell = ""; }
    else cell += ch;
  }
  if (cell !== "" || row.length){ row.push(cell); rows.push(row); }
  return rows.filter(r => r.some(c => c.trim() !== ""));
}

function contactsCSV(){
  const {list} = buildNetwork();
  const real = list.filter(e => !e.example).sort((a,b) => a.name.localeCompare(b.name));
  const head = ["Name","Company","Role","Industry","Email","Phone","LinkedIn","Tags","How you met","Where you met","Last contact","Follow up by","Stay in touch","You owe them","Remember","Notes","History"];
  const lines = [head.map(csvCell).join(",")];
  for (const e of real){
    lines.push([e.name, e.firm, e.role, e.industry, e.email, e.phone, e.linkedin, e.tags.join("; "),
      MEET[e.person?.metHow]?.label || "", e.howMet, e.last, e.followUp, CADENCES.find(c => c[0] === e.cadence)?.[1] || "",
      [...e.owes.map(o => o.what), ...e.owe].join("; "), [...e.remember, ...e.personal].join("; "), e.notes,
      [...e.log.map(x => `${x.date} ${x.kind}${x.note ? ": " + x.note : ""}`), ...e.convs.map(c => `${c.date} ${c.kind === "interview" ? "Interview" : "Coffee chat"}${c.debrief?.summary ? ": " + c.debrief.summary : ""}`)].sort().join(" | ")
    ].map(csvCell).join(","));
  }
  return {csv: lines.join("\r\n") + "\r\n", count: real.length};
}

// Hands the viewer a file: Claude's download prompt inside Claude, a normal download elsewhere
async function offerFile(filename, text){
  if (window.claude?.use){
    const dl = await window.claude.use("downloads").catch(() => null);
    if (dl){
      try{ await dl.save({filename, data:text}); return "saved"; }
      catch(e){ return e?.code === "declined" ? "declined" : "failed"; }
    }
    return "failed";
  }
  try{
    const url = URL.createObjectURL(new Blob([text], {type:"text/csv"}));
    const a = document.createElement("a"); a.href = url; a.download = filename; document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
    return "saved";
  }catch{ return "failed"; }
}

// ---------- Reading contact spreadsheets: CSV, Excel (.xlsx/.xls), Numbers, OpenDocument ----------
// Columns are matched by meaning, so "Firm", "Employer", and "Org" all count as company. Earlier patterns win.
const COLMAP = [
  ["email",       /e-?mail/],
  ["phone",       /(phone|mobile|cell|^tel)/],
  ["linkedin",    /(linkedin|profile url|^url$)/],
  ["followUp",    /(follow.?up|next (step|touch|contact|reach.?out) (date|by)|reach out by|next touch)/],
  ["lastContact", /(last (contact|contacted|touch|touchpoint|spoke|talked|reached|chat|conversation|interaction)|date met|met on|date of (contact|meeting|chat|call)|^date$|contacted on|connected on|when (we )?met|last met)/],
  ["howMet",      /(how (we |you |i )?met|where (we |you |i )?met|^met (at|via|through)|^event|^source$|introduced by|^intro( by)?$|referr?ed by|referral|^context$|^met$)/],
  ["first",       /^(first|first name|firstname|given name|fname|preferred name)$/],
  ["last",        /^(last|last name|lastname|surname|family name|lname)$/],
  ["name",        /^(name|names|full name|contact|contact name|person|who|attendee|guest|candidate|connection|people|person name)$/],
  ["firm",        /(company|organi[sz]ation|^firm|employer|^org$|^business|works? at|where (they|he|she) works?|^school)/],
  ["role",        /(title|position|role|^job|function|seniority|level)/],
  ["industry",    /(industry|sector|^field$|vertical)/],
  ["tags",        /(^tags?$|category|^group|^type$|^status$|^list$|^label|priority|tier)/],
  ["notes",       /(notes?|comments?|details|summary|remarks|next steps?|topics?|discussed|takeaways?|^about$|^info$)/],
];
const FIELD_LABEL = {name:"Name", first:"First name", last:"Last name", firm:"Company", role:"Role", email:"Email", phone:"Phone", linkedin:"LinkedIn",
  industry:"Industry", howMet:"How you met", lastContact:"Last contact", followUp:"Follow up by", tags:"Tags", notes:"Notes"};
const normHead = s => String(s ?? "").trim().toLowerCase().replace(/[_*#:()\[\]]+/g, " ").replace(/\s+/g, " ").trim();
function mapHeader(row){
  const m = {};
  row.forEach((h, i) => { const n = normHead(h); if (!n) return;
    const hit = COLMAP.find(([f, re]) => m[f] === undefined && re.test(n)); if (hit) m[hit[0]] = i; });
  return m;
}
const hasName = m => m.name !== undefined || m.first !== undefined;
// Finds the header row: the first of the top 20 rows with a name column and at least one other known column
function findHeader(rows){
  for (let i = 0; i < Math.min(rows.length, 20); i++){ const m = mapHeader(rows[i]); if (hasName(m) && Object.keys(m).length >= 2) return {hi:i, map:m}; }
  for (let i = 0; i < Math.min(rows.length, 20); i++){ const m = mapHeader(rows[i]); if (hasName(m)) return {hi:i, map:m}; }
  return null;
}
// Dates arrive as Date objects (Excel), ISO text, "10/22/2026", "Oct 22", or Excel serial numbers
function toYmdLoose(v){
  if (v == null || v === "") return "";
  if (v instanceof Date) return isNaN(v) ? "" : ymd(v);
  const s = String(v).trim();
  if (/^\d{5}(\.\d+)?$/.test(s)){ const n = Number(s); if (n > 20000 && n < 80000) return ymd(new Date(Math.round((n - 25569) * 86400000) + new Date().getTimezoneOffset() * 60000)); }
  if (/^\d{4}-\d{2}-\d{2}/.test(s)) return s.slice(0, 10);
  let t = new Date(s);
  if (!isNaN(t) && t.getFullYear() < 2000 && !/\d{4}/.test(s)) t.setFullYear(new Date().getFullYear());   // "Oct 22" with no year
  return isNaN(t) || t.getFullYear() < 1950 ? "" : ymd(t);
}
function rowsToPeople(rows, hi, map){
  const fromLinkedIn = rows[hi].some(c => normHead(c) === "connected on");
  const get = (r, f) => map[f] !== undefined && map[f] >= 0 ? (r[map[f]] instanceof Date ? r[map[f]] : String(r[map[f]] ?? "").trim()) : "";
  const out = [];
  let lastName = "";
  for (const r of rows.slice(hi + 1)){
    let name = String(get(r, "name") || [get(r, "first"), get(r, "last")].filter(Boolean).join(" ")).trim();
    if (!name || /^(total|totals|sum|count|name|example|e\.g\.?)\b/i.test(name) || name.length > 80) continue;
    if (name === lastName && !get(r, "email")) continue;   // a repeated row
    lastName = name;
    const last = toYmdLoose(get(r, "lastContact")), fu = toYmdLoose(get(r, "followUp"));
    const tags = String(get(r, "tags") || "").split(/[;,|]/).map(x => x.trim()).filter(Boolean).slice(0, 5);
    out.push({name, firm:String(get(r, "firm")), role:String(get(r, "role")), email:String(get(r, "email")).replace(/^mailto:/i, ""), phone:String(get(r, "phone")),
      linkedin:String(get(r, "linkedin")).replace(/^https?:\/\/(www\.)?/, "").replace(/\/$/, ""), industry:String(get(r, "industry")),
      howMet:String(get(r, "howMet")), tags, notes:String(get(r, "notes")),
      date: last && last <= today() ? last : "", followUp: fu});
  }
  const used = Object.fromEntries(Object.entries(map).filter(([, i]) => i >= 0).map(([f, i]) => [f, String(rows[hi][i] ?? "").trim() || `column ${i + 1}`]));
  return {people:out, fromLinkedIn, used};
}
// When the headers are too unusual for the rules, ask the AI which column is which (it sees the header and 5 rows only)
async function aiMapColumns(rows){
  if (!sample) return null;
  const top = rows.slice(0, 12).map((r, i) => `row ${i}: ` + r.slice(0, 20).map((c, j) => `[${j}] ${String(c instanceof Date ? ymd(c) : c ?? "").slice(0, 40)}`).join(" | ")).join("\n");
  try{
    const r = await sample.json(`This is the top of a spreadsheet someone uses to track their professional contacts. Find the header row and which column holds each field. Use -1 when a field isn't there. Never guess a column whose values don't fit the field.

${top}

Reply with only JSON: {"headerRow": 0, "columns": {"name": -1, "first": -1, "last": -1, "firm": -1, "role": -1, "email": -1, "phone": -1, "linkedin": -1, "industry": -1, "howMet": -1, "lastContact": -1, "followUp": -1, "tags": -1, "notes": -1}}`, {modelTier:"quick"});
    const hi = Number(r?.headerRow), cols = r?.columns || {};
    const map = {}; for (const f of Object.keys(FIELD_LABEL)){ const i = Number(cols[f]); if (Number.isInteger(i) && i >= 0 && i < 60) map[f] = i; }
    if (!Number.isInteger(hi) || hi < 0 || hi >= rows.length || !hasName(map)) return null;
    // Sanity check: the "name" column should hold words, not dates or numbers
    const vals = rows.slice(hi + 1, hi + 21).map(r => r[map.name ?? map.first]).filter(v => String(v ?? "").trim());
    const wordy = vals.filter(v => !(v instanceof Date) && /^[\p{L}][\p{L}'’.\- ]{0,60}$/u.test(String(v).trim())).length;
    if (!vals.length || wordy / vals.length < 0.7) return null;
    return {hi, map};
  }catch{ return null; }
}
async function readContactRows(rows){
  rows = rows.filter(r => r.some(c => String(c ?? "").trim() !== ""));
  if (!rows.length) return {error:"That file looks empty."};
  let h = findHeader(rows), byAI = false;
  if (!h){ h = await aiMapColumns(rows); byAI = !!h; }
  if (!h) return {error: sample ? "Couldn't tell which column has names. Add a header row with “Name” (or “First Name” and “Last Name”) and try again."
                                : "Couldn't find a name column. The file needs a header row with “Name”, or “First Name” and “Last Name”."};
  return {...rowsToPeople(rows, h.hi, h.map), byAI};
}
// Kept for CSV callers and tests
function readContactsFile(text){
  const rows = parseCSV(text); const h = findHeader(rows);
  if (!h) return {error:"Couldn't find a name column. The file needs a header row with “Name”, or “First Name” and “Last Name”."};
  return rowsToPeople(rows, h.hi, h.map);
}
// Excel support loads only when someone picks a spreadsheet file
let xlsxLoading = null;
function loadXLSX(){
  if (window.XLSX) return Promise.resolve(window.XLSX);
  return xlsxLoading ||= new Promise((ok, bad) => {
    const sc = document.createElement("script"); sc.src = "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";
    sc.onload = () => window.XLSX ? ok(window.XLSX) : bad(new Error("xlsx")); sc.onerror = () => { xlsxLoading = null; bad(new Error("xlsx")); };
    document.head.append(sc);
  });
}
// Picks the sheet that looks most like a contact list (skips "Instructions" or "Summary" tabs)
async function readSpreadsheet(buf){
  const X = await loadXLSX();
  const wb = X.read(buf, {type:"array", cellDates:true});
  let best = null;
  for (const name of wb.SheetNames){
    const rows = X.utils.sheet_to_json(wb.Sheets[name], {header:1, raw:true, defval:""});
    const h = findHeader(rows.filter(r => r.some(c => String(c ?? "").trim() !== "")));
    const score = (h ? 1000 : 0) + rows.length;
    if (!best || score > best.score) best = {name, rows, score};
  }
  return {rows: best ? best.rows : [], sheet: best?.name, sheets: wb.SheetNames.length};
}
const readFileAs = (file, how) => new Promise((ok, bad) => { const r = new FileReader(); r.onload = () => ok(r.result); r.onerror = bad; how === "text" ? r.readAsText(file) : r.readAsArrayBuffer(file); });
async function readAnyContactsFile(file){
  const isCSV = /\.(csv|txt|tsv)$/i.test(file.name) || /text\/(csv|plain|tab)/.test(file.type);
  if (isCSV){
    const text = String(await readFileAs(file, "text"));
    const tsv = /\.tsv$/i.test(file.name) || (!text.includes(",") && text.includes("\t"));
    return readContactRows(tsv ? text.split(/\r?\n/).map(l => l.split("\t")) : parseCSV(text));
  }
  let sheet;
  try{ sheet = await readSpreadsheet(new Uint8Array(await readFileAs(file, "buffer"))); }
  catch{ return {error:"Couldn't open that spreadsheet. Try saving it as .xlsx or CSV and choosing it again."}; }
  const r = await readContactRows(sheet.rows);
  return sheet.sheets > 1 && !r.error ? {...r, sheet: sheet.sheet} : r;
}

      if (r.date) addLog(p, importData.fromLinkedIn ? {date:r.date, kind:"Connected online", note:"Connected on LinkedIn"} : {date:r.date, kind:"Talked", note:"From your spreadsheet"});

  importData = null;
  render();

// Saves many records without tripping write limits: one write at a time when synced, one write total on this device
async function persistMany(docs, progress){
  if (useLocal || !db || !uid){ docs.forEach(d => d.updatedAt = Date.now()); lsWrite(); return; }
  let n = 0;
  for (const d of docs){
    d.updatedAt = Date.now();
    try{ await db.collection("data/users/"+uid).doc(d.id).set(JSON.parse(JSON.stringify(d))); }
    catch(e){ if (e?.code === "resource_exhausted"){ await new Promise(r => setTimeout(r, 1500)); try{ await db.collection("data/users/"+uid).doc(d.id).set(JSON.parse(JSON.stringify(d))); }catch{} } }
    n++; if (n % 10 === 0 || n === docs.length) progress?.(n);
  }
}

const GMAIL = "Gmail";
let mcp = null, gmailBusy = false, gmailMsg = "", gmailErrMsg = "", emailSuggest = [];
const gmailOn = () => !!me?.gmail?.on;
const cleanEmail = s => { const m = String(s||"").match(/[A-Z0-9._%+'-]+@[A-Z0-9.-]+\.[A-Z]{2,}/i); return m ? m[0].toLowerCase() : ""; };

function gmailError(e){

    case "server_not_connected": case "server_not_found": return "Gmail isn't connected to your Claude account. Add it in Claude under Settings → Connectors, then try again.";
    case "needs_reauth": return "Your Gmail connection expired. Reconnect Gmail in Claude under Settings → Connectors.";

    case "blocked_by_policy": case "approval_required": return "Your organization doesn't allow this page to use Gmail.";

async function searchGmail(query, pageSize){

async function syncGmail(manual){
  if (!mcp || gmailBusy || !gmailOn()) return;
  gmailBusy = true; gmailErrMsg = ""; gmailMsg = "Checking your email…"; refreshGmailUI();
  try{
    const {list} = buildNetwork();
    const real = list.filter(e => !e.example && e.person);
    const byEmail = new Map();
    for (const e of real) for (const em of emailsOf(e)) byEmail.set(em, e);
    const myEmails = new Set();
    const since = gmailDate(me.gmail.lastSync ? me.gmail.lastSync - 2 * 86400e3 : Date.now() - 90 * 86400e3);
    const touched = new Map(); let sentN = 0, gotN = 0;
    const emails = [...byEmail.keys()];
    for (let i = 0; i < emails.length; i += 15){
      const chunk = emails.slice(i, i + 15);
      const threads = await searchGmail(`{${chunk.map(x => `from:${x} to:${x} cc:${x}`).join(" ")}} after:${since}`, 50);
      for (const t of threads) for (const m of (t.messages || [])){
        const sent = (m.labelIds || []).includes("SENT");
        if (sent) myEmails.add(cleanEmail(m.sender));
        const date = m.date ? ymd(new Date(m.date)) : "";
        if (!date || !m.id) continue;
        const who = sent ? [...(m.toRecipients||[]), ...(m.ccRecipients||[])].map(cleanEmail) : [cleanEmail(m.sender)];
        for (const em of new Set(who)){
          const e = byEmail.get(em); if (!e) continue;
          const p = e.person, src = "gmail:" + m.id + ":" + (sent ? "out" : "in");
          p.log = Array.isArray(p.log) ? p.log : [];
          if (p.log.some(x => x.src === src) || (p.ignoreSrc||[]).includes(src)) continue;
          if (sent){
            // reuse a manual "Reached out" / "Email" tap from the same day instead of adding a second entry
            const same = p.log.find(x => !x.src && x.date === date && (x.kind === "Reached out" || x.kind === "Email" || x.kind === "Message"));
            if (same){ same.src = src; same.kind = "Email"; same.note = same.note || "Sent from Gmail"; }
            else p.log.push({id:"l"+uidGen(), date, kind:"Email", note:"Sent from Gmail", src});
            if (date > (p.lastContact||"")) p.lastContact = date;
            if (p.followUp && p.followUp <= date) p.followUp = "";
            (p.owes||[]).forEach(o => { if (!o.done && o.auto && date >= addDays(-1, o.due)){ o.done = true; o.doneOn = date; } });
            if (p.snoozeUntil && date >= today()) p.snoozeUntil = "";
            if (p.draft && date >= addDays(-3)) p.draft = null;
            e.convs.forEach(c => { if (c.debrief && !c.thankYouSent && !c.example && c.date <= date){ c.thankYouSent = true; persist(c, 0); } });
            sentN++;
          } else {
            p.log.push({id:"l"+uidGen(), date, kind:"Email received", note:"They emailed you", src});
            if (date > (p.lastContact||"")) p.lastContact = date;
            gotN++;
          }
          touched.set(p.id, p);
        }
      }
    }
    if (touched.size) await persistMany([...touched.values()], null);
    // Suggest email addresses for contacts who don't have one (only when asked, to keep Gmail calls light)
    let suggested = 0;
    if (manual){
      const missing = real.filter(e => !emailsOf(e).length && !e.person.emailAsked && e.name.trim().split(/\s+/).length >= 2)
        .sort((a,b) => (b.last||"").localeCompare(a.last||"")).slice(0, 20);
      const found = [];
      for (const e of missing){
        const threads = await searchGmail(`from:"${e.name.replace(/"/g, "")}" newer_than:3y`, 10);
        const counts = new Map();
        for (const t of threads) for (const m of (t.messages||[])){
          if ((m.labelIds||[]).includes("SENT")) continue;
          const em = cleanEmail(m.sender); if (!em || myEmails.has(em) || byEmail.has(em)) continue;
          counts.set(em, (counts.get(em)||0) + 1);
        }
        const best = [...counts.entries()].sort((a,b) => b[1] - a[1])[0];
        if (best) found.push({key:e.key, name:e.name, email:best[0], n:best[1]});
      }
      emailSuggest = found; suggested = found.length;
    }
    saveMe({gmail:{...me.gmail, on:true, lastSync:Date.now()}});
    const parts = [];
    if (sentN) parts.push(`${sentN} email${sentN>1?"s":""} you sent`);
    if (gotN) parts.push(`${gotN} you received`);
    gmailMsg = (parts.length ? `Logged ${parts.join(" and ")} with ${touched.size} contact${touched.size>1?"s":""}.` : (emails.length ? "No new emails with your contacts." : "None of your contacts have an email address yet, so there was nothing to match."))
      + (suggested ? ` Found email addresses for ${suggested} contact${suggested>1?"s":""}; review them below.` : "");
  }catch(e){
    gmailErrMsg = gmailError(e); gmailMsg = "";
  }finally{
    gmailBusy = false; renderSide(); refreshGmailUI();
  }
}

const calOn = () => !!me?.calendar?.on;
const calError = e => gmailError(e).replace(/Gmail/g, "Google Calendar");
const localStamp = d => `${ymd(d)}T00:00:00`;
const evStart = ev => new Date(ev.start?.dateTime || "");
const evEnd = ev => new Date(ev.end?.dateTime || ev.start?.dateTime || "");
const fmtWhen = d => {
  const day = ymd(d), t = d.toLocaleTimeString(undefined, {hour:"numeric", minute:"2-digit"});
  if (day === today()) return `Today at ${t}`;
  if (day === addDays(1)) return `Tomorrow at ${t}`;
  if (day === addDays(-1)) return `Yesterday at ${t}`;
  return d.toLocaleDateString(undefined, {weekday:"short", month:"short", day:"numeric"}) + ` at ${t}`;
};

async function initCal(){
  if (!mcp) return;
  refreshGmailUI();
  if (calOn()) syncCal(false);
}
async function connectCal(){
  saveMe({calendar:{...(me?.calendar||{}), on:true}});
  await syncCal(true);
  if (calErrMsg && !me.calendar.lastSync){ saveMe({calendar:{...me.calendar, on:false}}); refreshGmailUI(); }
}
function disconnectCal(){
  saveMe({calendar:{...(me?.calendar||{}), on:false}});
  calEvents = []; calByKey = new Map(); calErrMsg = "";
  calMsg = "Calendar is off. Meetings already logged stay in each contact's history.";
  render();
}

// Which contact is this meeting with? Attendee email first, then their full name in the event title.
function matchEvent(ev, real, byEmail){
  const people = [...(ev.attendees||[]), ev.organizer || {}].filter(a => a && !a.self && a.email);
  for (const a of people){ const e = byEmail.get(cleanEmail(a.email)); if (e) return {e, how:"email"}; }
  const title = (ev.summary || "").toLowerCase();
  if (!title) return null;
  for (const e of real){
    const n = e.name.trim().toLowerCase();
    if (n.split(/\s+/).length >= 2 && new RegExp("\\b" + n.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "\\b").test(title)) return {e, how:"name"};
  }
  return null;
}

async function syncCal(manual){
  if (!mcp || calBusy || !calOn()) return;
  calBusy = true; calErrMsg = ""; calMsg = "Checking your calendar…"; refreshGmailUI();
  try{
    const now = new Date();
    const from = new Date(now); from.setDate(from.getDate() - 7);
    const to = new Date(now); to.setDate(to.getDate() + 8);
    const events = []; let pageToken = "", pages = 0;
    do {
      const res = await mcp.callTool(GCAL, "list_events", {startTime:localStamp(from), endTime:localStamp(to), orderBy:"startTime", pageSize:250, ...(pageToken ? {pageToken} : {})}, {cache:false});
      const pl = res?.payload || {};
      events.push(...(Array.isArray(pl.events) ? pl.events : []));
      pageToken = pl.nextPageToken || ""; pages++;
    } while (pageToken && pages < 3);

    const {list} = buildNetwork();
    const real = list.filter(e => !e.example);
    const byEmail = new Map();
    for (const e of real) for (const em of emailsOf(e)) byEmail.set(em, e);
    const found = []; const touched = new Map(); let logged = 0;
    for (const ev of events){
      if (ev.status === "cancelled" || !ev.start?.dateTime) continue;          // skip cancelled and all-day events
      if ((ev.attendees||[]).length > 8) continue;                              // skip classes, webinars, big meetings
      const mine = (ev.attendees||[]).find(a => a.self);
      if (mine?.responseStatus === "declined") continue;
      const m = matchEvent(ev, real, byEmail); if (!m) continue;
      const start = evStart(ev), end = evEnd(ev);
      if (isNaN(start)) continue;
      const item = {id:ev.id, key:m.e.key, name:m.e.name, title:ev.summary || "Meeting", start:start.getTime(), end:end.getTime(), link:ev.htmlLink || "", how:m.how};
      found.push(item);
      // Log meetings that have already happened
      if (end < now && m.e.person){
        const p = m.e.person, src = "cal:" + ev.id;
        p.log = Array.isArray(p.log) ? p.log : [];
        if (!p.log.some(x => x.src === src) && !(p.ignoreSrc||[]).includes(src)){
          const date = ymd(start);
          p.log.push({id:"l"+uidGen(), date, kind:"Meeting", note:`${item.title} (from your calendar)`, src});
          if (date > (p.lastContact||"")) p.lastContact = date;
          touched.set(p.id, p); logged++;
        }
      }
    }
    if (touched.size) await persistMany([...touched.values()], null);
    calEvents = found; indexCal();
    saveMe({calendar:{...me.calendar, on:true, lastSync:Date.now()}});
    const up = found.filter(x => x.start > Date.now()).length;
    calMsg = found.length
      ? `Found ${up} upcoming meeting${up===1?"":"s"} with your contacts${logged ? ` and logged ${logged} past one${logged===1?"":"s"}` : ""}.`
      : "No meetings with your contacts in the past week or the next week.";
  }catch(e){
    calErrMsg = calError(e); calMsg = "";
  }finally{
    calBusy = false; render();
  }
}
function indexCal(){
  calByKey = new Map();
  const now = Date.now();
  for (const it of calEvents){
    if (!calByKey.has(it.key)) calByKey.set(it.key, {upcoming:[], past:[]});
    (it.start > now ? calByKey.get(it.key).upcoming : calByKey.get(it.key).past).push(it);
  }
}

// Prep / debrief reminders for one contact, used by the to-do list
function calReasonsFor(e){
  const c = calByKey.get(e.key); if (!c || !calOn()) return [];
  const seen = e.person?.calSeen || {};
  const out = [], now = Date.now();
  const convOn = d => e.convs.find(x => x.date === d && !x.example);
  for (const it of c.upcoming){
    if (it.start - now > 36 * 3600e3 || seen[it.id + ":prep"]) continue;
    const cv = convOn(ymd(new Date(it.start)));
    if (cv?.brief) continue;
    out.push({type:"prep", it, text:`Meeting ${fmtWhen(new Date(it.start)).replace(/^./, s => s.toLowerCase())}: prep for it`, score:4.5});
  }
  for (const it of c.past){
    if (now - it.end > 3 * 86400e3 || seen[it.id + ":debrief"]) continue;
    const d = ymd(new Date(it.start)), cv = convOn(d);
    if (cv?.debrief) continue;
    if (e.log.some(x => x.date >= d && !String(x.src||"").startsWith("cal:") && ["Email","Reached out","Text"].includes(x.kind))) continue;
    out.push({type:"debrief", it, text:`You met ${fmtWhen(new Date(it.start)).replace(/ at .*/, "").toLowerCase()}: debrief and send a thank-you`, score:4});
  }
  return out;
}
// Open (or create) the coffee chat for a calendar meeting
function openForMeeting(e, it, tab){
  const d = ymd(new Date(it.start));
  let c = e.convs.find(x => x.date === d && !x.example);
  if (!c){
    newConv(e, "coffee");
    c = chats[chats.length - 1];
    c.date = d; c.calEventId = it.id; c.notes = [c.notes, `Calendar: ${it.title}`].filter(Boolean).join("\n");
  }
  c.tab = tab; persist(c, 0); openConv(c.id);
}
function skipCal(e, it, type){
  const p = ensurePerson(e);
  p.calSeen = {...(p.calSeen||{}), [it.id + ":" + type]:true};
  persist(p, 0); render();
}

// ---------- Group email: one message, personalized for each person ----------
let grp = null;   // {keys:[], subject, body, personal, lines:{}, edits:{}, busy, msg, err, confirm, results:{}}
const GROUP_DEFAULT = "Hi {first name},\n\n\n\nBest,\n" ;
function grpState(){
  if (!grp) grp = {keys:[], subject:"", body:"", personal:false, lines:{}, edits:{}, busy:false, msg:"", err:"", confirm:false, results:{}, q:""};
  if (!grp.body) grp.body = GROUP_DEFAULT + (meFirst() || "");
  return grp;
}
function groupOptions(list){
  const m = new Map();
  const add = (k, label, e) => { if (!m.has(k)) m.set(k, {label, keys:[]}); m.get(k).keys.push(e.key); };
  for (const e of list){
    if (e.example) continue;
    e.tags.forEach(t => add("tag:" + t, `Tag: ${t}`, e));
    if (e.firm) add("co:" + e.firm, `Company: ${e.firm}`, e);
    if (e.industry) add("ind:" + e.industry, `Industry: ${e.industry}`, e);
    if (e.howMet) add("met:" + e.howMet, `Met at: ${e.howMet}`, e);
  }
  return [...m.entries()].sort((a,b) => b[1].keys.length - a[1].keys.length || a[1].label.localeCompare(b[1].label));
}
function personalize(e, g){
  if (g.edits[e.key] != null) return g.edits[e.key];
  let body = g.body;
  if (g.personal && !body.includes("{personal line}")){
    const i = body.indexOf("\n");
    body = i < 0 ? body + "\n\n{personal line}" : body.slice(0, i) + "\n\n{personal line}" + body.slice(i);
  }
  const line = g.personal ? (g.lines[e.key] || "") : "";
  const first = e.name.trim().split(/\s+/)[0];
  return body
    .replace(/\{first name\}/gi, first).replace(/\{name\}/gi, e.name).replace(/\{company\}/gi, e.firm || "your company")
    .replace(/\n*\{personal line\}\n*/gi, line ? `\n\n${line}\n\n` : "\n\n")
    .replace(/\n{3,}/g, "\n\n").trim();
}
const fillSubject = (e, g) => g.subject.replace(/\{first name\}/gi, e.name.split(/\s+/)[0]).replace(/\{company\}/gi, e.firm || "");

async function writeGroupLines(){
  const g = grpState(); if (!sample || g.busy) return;
  const {list} = buildNetwork();
  const chosen = g.keys.map(k => list.find(e => e.key === k)).filter(Boolean);
  if (!chosen.length) return;
  g.busy = true; g.err = ""; g.msg = "Writing a personal line for each person…"; renderMain();
  try{
    for (let i = 0; i < chosen.length; i += 25){
      const batch = chosen.slice(i, i + 25);
      const r = await sample.json(`For each person below, write ONE short sentence (under 25 words) the user can add to this group email so it feels personal. Base it only on the details given: what they talked about, personal details, how they met. If there's nothing useful to go on, return "" for that person rather than something generic. Sound natural and warm, in the user's voice, with no flattery and no "I hope this finds you well".

${meText()}

THE EMAIL:
Subject: ${g.subject || "(none)"}
${g.body}

PEOPLE (key=... identifies each):
${batch.map(e => [`key=${e.key}`, e.name, e.role, e.firm, e.howMet && "met: " + e.howMet, e.notes && "notes: " + e.notes.replace(/\s+/g, " ").slice(0, 300), (e.remember.length || e.personal.length) && "remember: " + [...e.remember, ...e.personal].join("; "), e.log.slice(-2).map(x => x.note).filter(Boolean).join("; ")].filter(Boolean).join(" | ")).join("\n")}

Reply with only JSON: {"lines": [{"key": "", "line": ""}]}`, {cache:false});
      for (const x of (r?.lines || [])) if (x?.key && typeof x.line === "string") g.lines[x.key] = x.line.trim();

    const n = chosen.filter(e => g.lines[e.key]).length;

async function createGroupDrafts(people){
  const g = grpState(); if (!mcp || g.busy) return;
  g.busy = true; g.confirm = false; g.err = ""; g.msg = `Creating drafts: 0 of ${people.length}…`; renderMain();
  let ok = 0, failed = 0;
  for (const e of people){
    if (g.results[e.key]?.url){ ok++; continue; }        // already created; don't make duplicates
    try{
      const res = await mcp.callTool(GMAIL, "create_draft", {to:[emailsOf(e)[0]], subject:fillSubject(e, g), body:personalize(e, g)});
      const pl = res?.payload || {};
      g.results[e.key] = {url: pl.viewUrl || "https://mail.google.com/mail/#drafts"}; ok++;
    }catch(err){
      g.results[e.key] = {err: err?.code === "not_in_manifest" ? "Gmail drafts weren't allowed" : "draft not created"}; failed++;
      if (["not_in_manifest","server_not_connected","needs_reauth","blocked_by_policy"].includes(err?.code)){ g.err = gmailError(err); break; }
    }
    g.msg = `Creating drafts: ${ok + failed} of ${people.length}…`;
    if (sel.type === "group") renderMain();
  }
  g.busy = false;
  if (!g.err) g.msg = failed ? `Created ${ok} drafts. ${failed} didn't work; press Create again to retry just those.` : `Created ${ok} draft${ok===1?"":"s"} in your Gmail Drafts folder. Review and send them from Gmail; nothing was sent.`;
  if (sel.type === "group") renderMain();
}

// Strip WebVTT / SRT cue numbers and timing lines; merge consecutive lines from the same speaker
function cleanTranscript(raw){
  const lines = raw.replace(/\r/g,"").split("\n");
  const out = []; let last = null;
  for (let l of lines){
    l = l.trim();
    if (!l || l === "WEBVTT" || /^\d+$/.test(l) || /-->/.test(l) || /^NOTE\b/.test(l)) continue;
    const m = l.match(/^([^:]{1,40}):\s*(.*)$/);
    if (m && last && last.who === m[1]) { last.text += " " + m[2]; continue; }
    if (m){ last = {who:m[1], text:m[2]}; out.push(last); }
    else if (last) last.text += " " + l;
    else { last = {who:"", text:l}; out.push(last); }
  }
  return out.map(x => x.who ? `${x.who}: ${x.text}` : x.text).join("\n");
}

PLANNED QUESTIONS:
${qs||"(no prep)"}

USER'S NOTES:
${c.liveNotes||"(none)"}

TRANSCRIPT:
${transcript||"(no transcript)"}`;
  try{
    const r = await sample.json(prompt);
    if (!r || !Array.isArray(r.scorecard)) throw {code:"invalid_json"};
    c.debrief = r; c.debriefedOn = today(); persist(c, 0);
    // the debrief's thank-you replaces the automatic "nice to meet you" / "thank-you" reminder
    const owner = buildNetwork().list.find(x => x.convs.includes(c));
    if (owner?.person){ resolveAutoOwes(owner.person); persist(owner.person, 0); }
    st.textContent = ""; btn.textContent = "Redo debrief";
    drawDebrief(c); renderList();
  }catch(e){ st.className="status err"; st.textContent = errCopy(e); }
  finally{ btn.disabled = false; }
}

function errCopy(e){
  switch(e?.code){
    case "not_granted": case "sampling_disabled": return "AI features aren't available. Inside Claude, allow this page to use Claude; on a hosted copy, reload and enter the access code.";
    case "rate_limited": return "Too many requests right now. Wait a minute and try again.";
    case "prompt_too_large": return "The transcript is too long. Trim it to the main part of the chat and try again.";
    case "invalid_json": case "empty_completion": return "The answer came back garbled. Press the button again.";
    case "session_expired": return "You've been signed out. Sign in to Claude and reload.";
    case "refused": return "Claude couldn't process this input. Check the transcript for anything unusual.";
    default: return "Something went wrong reaching Claude. Try again.";
  }
}


// ---------- Standalone AI (used when not running inside Claude) ----------
function parseLoose(t){
  try{ return JSON.parse(t); }catch{}
  const f = t.match(/```(?:json)?\s*([\s\S]*?)```/); if (f){ try{ return JSON.parse(f[1]); }catch{} }
  const a = t.search(/[\[{]/), b = Math.max(t.lastIndexOf("}"), t.lastIndexOf("]"));
  if (a >= 0 && b > a){ try{ return JSON.parse(t.slice(a, b+1)); }catch{} }
  throw {code:"invalid_json", text:t};
}
// Shrinks a photo before upload so it sends quickly and fits the server's size limit
async function photoToBase64(file, max = 1600){
  let blob = file;
  try{
    const bmp = await createImageBitmap(file);
    const k = Math.min(1, max / Math.max(bmp.width, bmp.height));
    const c = document.createElement("canvas"); c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
    c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
    blob = await new Promise(r => c.toBlob(r, "image/jpeg", 0.85)) || file;
  }catch{}
  const data = await new Promise((ok, bad) => { const r = new FileReader(); r.onload = () => ok(String(r.result).split(",")[1]); r.onerror = bad; r.readAsDataURL(blob); });
  return {media_type: blob.type && blob.type.startsWith("image/") ? blob.type : "image/jpeg", data};
}
function makeServerSample(){
  async function call(prompt, opts = {}, retried = false){
    let code = null; try{ code = localStorage.getItem("nw-access"); }catch{}
    let res;
    try{
      res = await fetch("api/claude", {method:"POST",
        headers:{"content-type":"application/json", ...(code ? {"x-access-code":code} : {})},
        body:JSON.stringify({prompt, tier:opts.modelTier || "default", images: opts._images || undefined})});
    }catch{ throw {code:"upstream_error"}; }
    if (res.status === 401){
      if (!retried){
        const c = window.prompt("This NetWork site needs an access code. Enter it to use the AI features:");
        if (c){ try{ localStorage.setItem("nw-access", c.trim()); }catch{} return call(prompt, opts, true); }
      }
      throw {code:"not_granted"};
    }
    if (res.status === 413) throw {code:"prompt_too_large"};
    if (res.status === 429) throw {code:"rate_limited"};
    if (!res.ok) throw {code:"upstream_error"};
    const j = await res.json().catch(() => ({}));
    if (!j.text) throw {code:"empty_completion"};
    return {text:j.text, truncated:!!j.truncated};
  }
  const withImages = async (o = {}) => o.images ? {...o, _images: await Promise.all([].concat(o.images instanceof FileList ? [...o.images] : o.images).slice(0, 4).map(f => photoToBase64(f)))} : o;
  const s = async (p, o) => call(p, await withImages(o));
  s.json = async (p, o) => { const {text} = await call(p + "\n\nReply with only the JSON value and no other text.", await withImages(o)); return parseLoose(text); };
  s.limits = async () => ({maxPromptBytes: 200000, images: {maxCount: 4, maxInputBytes: 20 * 1024 * 1024, mediaTypes: ["image/jpeg","image/png","image/webp","image/gif"]}});
  return s;
}


// ---------- Boot ----------
render();
window.addEventListener("resize", () => { const was = document.body.dataset.pane; renderSide(); if (was !== document.body.dataset.pane) render(); });
(async () => {
  const cl = window.claude;
  if (!cl?.use){
    // Running on its own (GitHub / Vercel / local): AI goes through this site's /api/claude, data stays in this browser
    useLocal = true; splitDocs(lsRead()); render();
    // Only turn on AI if this site has the /api/claude server (GitHub Pages doesn't)
    if (location.protocol.startsWith("http")){
      try{ const r = await fetch("api/claude", {method:"GET"}); if (r.status !== 404) { sample = makeServerSample(); render(); } }catch{}
    }
    return;
  }
  const [u, d, s] = await Promise.all([cl.use("user"), cl.use("db"), cl.use("sample")]);
  sample = s;
  uid = u ? await u.id() : null;
  db = d;
  if (!db || !uid){ useLocal = true; splitDocs(lsRead()); render(); initGmail().then(initCal); return; }
  let first = true;
  db.collection("data/users/"+uid).onSnapshot(snap => {
    const incoming = snap.docs.map(x => ({...x.data(), id:x.id}));
    // keep the objects this page is editing so typing isn't overwritten
    const local = new Map([...chats, ...people].map(c => [c.id, c]));
    const merged = incoming.map(c => (timers[c.id] && local.has(c.id)) ? local.get(c.id) : c);
    for (const [id, c] of local) if (!merged.find(x => x.id === id) && timers[id]) merged.push(c);
    splitDocs(merged);
    if (first){ first = false; render(); initGmail().then(initCal); return; }
    renderSide();
    const typing = document.activeElement && document.activeElement.closest?.("#main") && /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
    if (!typing && !pending.length && sel.type !== "edit" && sel.type !== "conv") renderMain();
  }, () => setSave("Couldn't load your contacts. Reload the page."));
})();
