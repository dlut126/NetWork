<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>[hidden]{display:none!important}img{max-width:100%}body{margin:0}</style>
<title>NetWork</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a contacts app. Contact list on the left, the selected person's card on the right; one column on phones. */
:root{
  --bg:#F3F4F7; --panel:#FFFFFF; --sunk:#F6F7FA; --line:#E2E5EE; --ink:#141826; --soft:#5E6579; --faint:#8A90A3;
  --accent:#2B44D6; --accent-ink:#FFFFFF; --accent-wash:#E9EDFF;
  --attn:#A35A00; --attn-wash:#FFF3D6; --bad:#B3261E; --good:#1E7A44; --good-wash:#E2F4E8;
  --av-l:88%; --av-s:55%; --av-tl:28%;
  --brand:"Big Shoulders Display","Arial Narrow",sans-serif;
  --body:"IBM Plex Sans",ui-sans-serif,system-ui,-apple-system,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1018; --panel:#161925; --sunk:#1B1F2D; --line:#272C3D; --ink:#E7E9F2; --soft:#A2A8BC; --faint:#737A90;
  --accent:#8C9BFF; --accent-ink:#0E1018; --accent-wash:#1F2547;
  --attn:#F2B85C; --attn-wash:#3A2B10; --bad:#FF8A80; --good:#7BD9A0; --good-wash:#143021;
  --av-l:26%; --av-s:40%; --av-tl:84%; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1018; --panel:#161925; --sunk:#1B1F2D; --line:#272C3D; --ink:#E7E9F2; --soft:#A2A8BC; --faint:#737A90;
  --accent:#8C9BFF; --accent-ink:#0E1018; --accent-wash:#1F2547;
  --attn:#F2B85C; --attn-wash:#3A2B10; --bad:#FF8A80; --good:#7BD9A0; --good-wash:#143021;
  --av-l:26%; --av-s:40%; --av-tl:84%; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);padding-inline:16px;padding-block:16px}
button{font:inherit;color:inherit}
.app{height:100%;max-width:1240px;margin:0 auto;display:grid;grid-template-columns:350px minmax(0,1fr);gap:16px}
.side,.main{background:var(--panel);border:1px solid var(--line);border-radius:12px;min-width:0;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.main-scroll{overflow-y:auto;flex:1;min-height:0}
@media (max-width:820px){
  html,body{height:auto}
  .app{height:auto;grid-template-columns:1fr}
  body[data-pane="list"] .main{display:none}
  body[data-pane="detail"] .side{display:none}
  .main-scroll{overflow:visible}
}

/* Side list */
.side-head{display:flex;align-items:center;justify-content:space-between;padding:14px 14px 10px}
.brand{font:800 26px/1 var(--brand);text-transform:uppercase;letter-spacing:.01em}
.brand b{color:var(--accent);font-weight:800}
.icon-btn{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--panel);cursor:pointer;display:grid;place-items:center;font-size:22px;line-height:1}
.icon-btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.search{padding:0 14px 10px}
.search input{width:100%;font:inherit;color:var(--ink);background:var(--sunk);border:1px solid transparent;border-radius:9px;padding:9px 12px}
.filters{display:flex;gap:6px;align-items:center;padding:0 14px 10px;flex-wrap:wrap}
.pill{border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:5px 11px;font-size:13px;font-weight:500;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.pill[aria-pressed="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.pill .n{font:500 12px var(--mono);opacity:.75}
.pill.attn[aria-pressed="false"] .n{color:var(--attn);opacity:1}
.group-sel{margin-left:auto;font:inherit;font-size:13px;color:var(--soft);background:transparent;border:none;cursor:pointer;padding:4px}
.clist{overflow-y:auto;flex:1;min-height:0;border-top:1px solid var(--line)}
@media (max-width:820px){.clist{overflow:visible}}
.today-row{all:unset;box-sizing:border-box;cursor:pointer;display:flex;gap:12px;align-items:center;width:100%;padding:12px 14px;border-bottom:1px solid var(--line)}
.today-row:hover,.crow:hover{background:var(--sunk)}
.today-row[aria-current="true"],.crow[aria-current="true"]{background:var(--accent-wash)}
.today-ico{width:40px;height:40px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font:600 13px var(--mono)}
.ghead{position:sticky;top:0;background:var(--panel);font:600 12px var(--body);color:var(--soft);padding:10px 14px 4px;border-bottom:1px solid var(--line);z-index:1}
.crow{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;padding:9px 14px}
.crow:focus-visible,.today-row:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.cname{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.csub{font-size:13px;color:var(--soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cmeta{display:flex;flex-direction:column;align-items:flex-end;gap:3px;font:500 11.5px var(--mono);color:var(--faint);font-variant-numeric:tabular-nums}
.dot{width:8px;height:8px;border-radius:50%;background:var(--attn)}
.ex{font:500 10px/1 var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--attn);background:var(--attn-wash);padding:3px 5px;border-radius:4px}
.empty-list{padding:24px 14px;color:var(--soft);font-size:14px}

/* Avatars */
.av{--h:220;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:15px;
  background:hsl(var(--h) var(--av-s) var(--av-l));color:hsl(var(--h) 45% var(--av-tl));flex:none}
.av.lg{width:84px;height:84px;font-size:30px}

/* Main panes */
.pane-head{display:flex;align-items:center;gap:10px;padding:12px 18px;border-bottom:1px solid var(--line);min-height:56px}
.back{all:unset;cursor:pointer;color:var(--accent);font-weight:500;display:inline-flex;gap:4px;align-items:center}
.back:focus-visible{outline:2px solid var(--accent);border-radius:4px}
@media (min-width:821px){.back.mobile-only{display:none}}
.pane-head .spacer{flex:1}
.section{padding:18px 22px;display:flex;flex-direction:column;gap:12px;border-bottom:1px solid var(--line)}
.section:last-child{border-bottom:0}
.section h2{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--soft);margin:0}
.section h1{font-size:24px;line-height:1.2;margin:0;font-weight:600}

.hero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:26px 22px 18px}
.hero h1{font-size:26px;font-weight:600;margin:6px 0 0;line-height:1.15}
.hero .sub{color:var(--soft)}
.tags{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.tag{font-size:12px;padding:3px 9px;border-radius:99px;background:var(--sunk);border:1px solid var(--line);color:var(--soft)}
.tag.ind{color:var(--accent);border-color:var(--accent-wash);background:var(--accent-wash)}
.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;padding:6px 22px 20px;border-bottom:1px solid var(--line)}
.act{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:72px;padding:10px 8px;border-radius:12px;background:var(--sunk);font-size:12.5px;font-weight:500;color:var(--accent)}
.act svg{width:20px;height:20px}
.act:hover{background:var(--accent-wash)}
.act[aria-disabled="true"]{color:var(--faint);cursor:default;background:var(--sunk)}
.act:focus-visible{outline:2px solid var(--accent)}
.banner{margin:16px 22px 0;padding:12px 14px;border-radius:10px;background:var(--attn-wash);color:var(--ink);display:flex;flex-direction:column;gap:4px}
.banner b{color:var(--attn);font-size:13px;text-transform:uppercase;letter-spacing:.05em}
.banner ul{margin:0;padding-left:18px}
.fieldlist{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.frow{display:grid;grid-template-columns:150px minmax(0,1fr);gap:12px;padding:10px 14px;border-bottom:1px solid var(--line);align-items:center}
.frow:last-child{border-bottom:0}
@media (max-width:520px){.frow{grid-template-columns:1fr;gap:2px}}
.fl{font-size:13px;color:var(--soft)}
.fv{min-width:0;overflow-wrap:anywhere}
.fv select{font:inherit;color:var(--ink);background:transparent;border:none;padding:0;cursor:pointer}
.late{color:var(--bad)}
.owe{display:inline;background:var(--attn-wash);color:var(--ink);padding:1px 6px;border-radius:4px}
.notes{white-space:pre-wrap;margin:0}
.draft{border:1px solid var(--accent);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:8px;background:var(--accent-wash)}
.draft-text{white-space:pre-wrap}
.snooze{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:12px 14px;border-radius:10px;background:var(--sunk)}
.convs{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.conv-row{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:11px 14px;border-bottom:1px solid var(--line)}
.conv-row:last-child{border-bottom:0}
.conv-row:hover{background:var(--sunk)}
.conv-row:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.conv-row .t{font-weight:500}
.conv-row .d{font-size:13px;color:var(--soft)}

/* Controls */
.btn{font:600 14px/1 var(--body);padding:10px 14px;border-radius:9px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}
.btn:hover{background:var(--sunk)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.small{padding:7px 11px;font-size:13px}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,.tab:focus-visible,.pill:focus-visible,.icon-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.status{color:var(--soft);font-size:14px}
.status.err{color:var(--bad)}
.hint{color:var(--soft);font-size:13.5px;margin:0}
.label{font-size:12.5px;font-weight:500;color:var(--soft)}
input,textarea,select.input{font:inherit;color:var(--ink);background:var(--sunk);border:1px solid var(--line);border-radius:9px;padding:9px 11px;width:100%}
textarea{resize:vertical;min-height:90px;line-height:1.5}
textarea.tall{min-height:180px}
.capture textarea{min-height:96px;font-size:16px;background:var(--panel)}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px}
@media (max-width:560px){.fields{grid-template-columns:1fr}}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field.full{grid-column:1/-1}
.parsed{border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px;background:var(--sunk)}
.parsed input,.parsed textarea,.parsed select{background:var(--panel)}
.reach-card{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:40px minmax(0,1fr);gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:10px}
.reach-card:hover{background:var(--sunk)}
.reach-card:focus-visible{outline:2px solid var(--accent)}
.reach-card .why{font-size:13.5px;color:var(--attn)}
.stats{display:flex;gap:28px;flex-wrap:wrap}
.stat b{font:600 24px/1 var(--body);display:block;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--soft)}

/* Conversation pane (prep / during / debrief) */
.chathead{padding:16px 22px 0;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-start}
.chathead h2{font-size:22px;font-weight:600;margin:2px 0 0}
.chathead p{margin:2px 0 0;color:var(--soft)}
.kind{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--accent)}
.example-flag{font:500 11px/1 var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--attn);background:var(--attn-wash);padding:5px 8px;border-radius:6px}
.tabs{display:flex;gap:4px;padding:14px 22px 0;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{all:unset;cursor:pointer;padding:9px 14px;font-weight:500;color:var(--soft);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tab .n{font:500 12px var(--mono);margin-right:6px;opacity:.7}
.tab[aria-selected="true"]{color:var(--ink);border-color:var(--accent)}
.pane{padding:20px 22px;display:flex;flex-direction:column;gap:18px}
.seg{display:inline-flex;background:var(--sunk);border-radius:9px;padding:3px;gap:2px}
.seg button{all:unset;cursor:pointer;padding:7px 14px;border-radius:7px;font-weight:500;font-size:14px;color:var(--soft)}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.1)}
.seg button:disabled{cursor:default}
.out{display:flex;flex-direction:column;gap:16px}
.block{border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:8px}
.block h3{font-size:16px;font-weight:600;margin:0}
.block p{margin:0;max-width:72ch}
ul.plain{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;max-width:72ch}
.qlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.qlist li{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;padding:10px 12px;background:var(--sunk);border:1px solid var(--line);border-radius:9px}
.qlist input{width:18px;height:18px;margin-top:3px;accent-color:var(--accent)}
.qlist .q{font-weight:600}
.qlist .why{color:var(--soft);font-size:13px}
.qlist li.asked{opacity:.55}
.qlist li.asked .q{text-decoration:line-through}
.pitch{font-size:16px;border-left:3px solid var(--accent);padding-left:12px}
.consent{padding:12px 14px;border-radius:10px;background:var(--attn-wash)}
.consent b{color:var(--attn)}
.timer{font:500 28px/1 var(--mono);font-variant-numeric:tabular-nums}
.file-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.file-row input[type=file]{width:auto;padding:6px;font-size:13px}
.score{display:grid;grid-template-columns:160px 100px 1fr;gap:8px 14px;align-items:start;padding:10px 0;border-bottom:1px solid var(--line)}
.score:last-child{border-bottom:0}
@media (max-width:640px){.score{grid-template-columns:1fr auto}.score .ev{grid-column:1/-1}}
.score .sk{font-weight:600}
.dots{display:flex;gap:4px;align-items:center;padding-top:6px}
.dots i{width:12px;height:12px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--accent)}
.ev{font-size:14px}.ev .tip{color:var(--soft);display:block;margin-top:2px}
.verdict{font-size:18px;font-weight:600;max-width:60ch}
.email{background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:14px;white-space:pre-wrap;font-size:14.5px;max-width:72ch}
.email .subj{font-weight:600;display:block;margin-bottom:8px}
.commit{display:grid;grid-template-columns:auto 1fr;gap:4px 10px}
.who{font:500 11px/1 var(--mono);text-transform:uppercase;padding:4px 6px;border-radius:5px;background:var(--sunk);align-self:start;margin-top:3px}
.who.me{background:var(--accent-wash);color:var(--accent)}
.modes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media (max-width:520px){.modes{grid-template-columns:1fr}}
.mode{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;gap:2px;padding:12px 14px;border:1px solid var(--line);border-radius:10px}
.mode:hover{background:var(--sunk)}
.mode[aria-selected="true"]{border-color:var(--accent);background:var(--accent-wash)}
.mode:focus-visible{outline:2px solid var(--accent)}
.mode .mt{font-weight:600}
.mode .md{font-size:13px;color:var(--soft)}
.opt{font-weight:400;color:var(--faint)}
.quick-grid{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:12px}
@media (max-width:640px){.quick-grid{grid-template-columns:1fr}}
.linkish{all:unset;cursor:pointer;color:var(--accent);font-weight:600;text-decoration:underline}
.pending{display:flex;flex-direction:column;gap:10px}
.pcard{border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}
.pcard.unsure{border-color:var(--attn)}
.unsure-note{font-size:13px;font-weight:600;color:var(--attn);background:var(--attn-wash);padding:6px 10px;border-radius:8px}
.pc-top{display:flex;gap:12px;align-items:flex-start}
details.more{border-top:1px solid var(--line);padding-top:10px}
details.more summary{cursor:pointer;color:var(--accent);font-weight:500;font-size:14px;margin-bottom:10px}
.log-matches{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.log-matches:empty{display:none}
.log-matches .crow{grid-template-columns:40px minmax(0,1fr) 0}
.log-matches .hint{padding:12px 14px}
.finish{margin:16px 22px 0;padding:14px;border-radius:10px;border:1px dashed var(--accent);background:var(--accent-wash);display:flex;flex-direction:column;gap:10px}
.finish input,.finish textarea{background:var(--panel)}
a.btn{text-decoration:none;display:inline-block}
.todo-group{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.todo-title{font-size:13px;font-weight:600;padding:9px 14px;background:var(--sunk);border-bottom:1px solid var(--line);display:flex;gap:8px}
.todo-title .n{font:500 12px var(--mono);color:var(--soft)}
.todo{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.todo:last-child{border-bottom:0}
.todo-main{all:unset;cursor:pointer;display:grid;grid-template-columns:40px minmax(0,1fr);gap:12px;align-items:center;flex:1 1 240px;min-width:0}
.todo-main:focus-visible{outline:2px solid var(--accent);border-radius:6px}
.todo-main .why{font-size:13.5px;color:var(--attn)}
.todo-acts{display:flex;gap:6px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:6px 12px;font-size:13.5px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.remember{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.remember li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 12px;background:var(--sunk);border-radius:8px}
.x{all:unset;cursor:pointer;color:var(--faint);font-size:18px;line-height:1;padding:2px 6px;border-radius:6px}
.x:hover{color:var(--bad);background:var(--panel)}
.x.armed{color:var(--bad);font-size:12px}
.x:focus-visible{outline:2px solid var(--accent)}
.add-line{display:flex;gap:8px}
.timeline{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.timeline li{display:grid;grid-template-columns:72px minmax(0,1fr) auto;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);align-items:start}
.timeline li:last-child{border-bottom:0}
.tl-date{font:500 12.5px var(--mono);color:var(--soft);padding-top:2px}
.tl-note{color:var(--soft);font-size:14px;margin-top:2px;white-space:pre-wrap}
.search-links{display:flex;gap:8px;flex-wrap:wrap}
.find-row{padding:10px 0;border-bottom:1px solid var(--line);width:100%;box-sizing:border-box}
.find-row:last-child{border-bottom:0}
.owelist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.owelist li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 12px;background:var(--attn-wash);border-radius:8px}
.tick{width:20px;height:20px;border-radius:50%;border:2px solid var(--attn);background:transparent;cursor:pointer;padding:0}
.tick:hover{background:var(--attn)}
.tick.static{cursor:default;border-style:dotted}
.tick:disabled{cursor:default}
.today-ico.hot{background:var(--bad);color:#fff}
.stat.hot b{color:var(--bad)}
.me-btn{font:600 13px var(--body);background:var(--sunk)}
.setup{margin:16px 22px 0;padding:14px 16px;border-radius:10px;background:var(--accent-wash);display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.setup .hint{margin-top:2px;max-width:56ch}
.me-note{font-size:14px;color:var(--soft);padding:10px 12px;background:var(--sunk);border-radius:9px}
.steps{padding:12px 14px;border-radius:10px;background:var(--sunk);display:flex;flex-direction:column;gap:6px}
.steps ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.connect{border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.connect.on{border-color:var(--good)}
.connect-top{display:flex;align-items:center;gap:10px}
.connect-name{font-weight:600}
.pill-state{font:500 11.5px var(--mono);padding:3px 8px;border-radius:99px;background:var(--sunk);color:var(--soft)}
.pill-state.ok{background:var(--good-wash);color:var(--good)}
.suggest{border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.sug-row{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:12px;align-items:center;padding-top:8px;border-top:1px solid var(--line)}
@media (max-width:520px){.sug-row{grid-template-columns:40px minmax(0,1fr)}.sug-row .row{grid-column:1/-1}}
.meet-row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 12px;border:1px solid var(--line);border-radius:10px}
.capture-in{min-height:64px;font-size:16px}
.capture-opts{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.capture-opts .where{max-width:240px;padding:7px 11px}
.photo-btn{display:inline-flex;gap:6px;align-items:center}
.photo-btn svg{flex:none}
.visually-hidden{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.more-links{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--faint)}
.tagnote{font-size:12px;font-weight:500;color:var(--accent);background:var(--accent-wash);padding:2px 7px;border-radius:99px;text-decoration:none;white-space:nowrap}
.pending-head{position:sticky;top:0;background:var(--panel);padding:6px 0;z-index:1}
.add-to{display:flex;flex-direction:column;gap:8px}
.chip.on{background:var(--accent-wash);border-color:var(--accent-wash);display:inline-flex;align-items:center;gap:4px;cursor:default}
.chip.on .x{font-size:15px;padding:0 2px}
.previews{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.pv{border-bottom:1px solid var(--line);padding:10px 14px}
.pv:last-child{border-bottom:0}
.pv summary{cursor:pointer;display:flex;gap:6px;align-items:baseline;flex-wrap:wrap}
.pv[open] summary{margin-bottom:8px}
.pv .row{margin-top:8px}
.send-row{padding-top:4px}
.ghead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.ghead-act{all:unset;cursor:pointer;color:var(--accent);font-size:12px;font-weight:500}
.ghead-act:focus-visible{outline:2px solid var(--accent);border-radius:4px}
.pane-head .btn + .btn{margin-left:6px}
.save-state{font:400 12px var(--mono);color:var(--faint)}
</style>

<body>

<div class="app">
  <aside class="side" id="side"></aside>
  <main class="main"><div class="main-scroll" id="main"></div></main>
</div>

<script>
// ---------- Examples (shown until the first real contact exists) ----------
// The example user is a data analyst exploring a move into consulting. Nothing here is real.
const EXAMPLE = {
  id:"example", example:true, kind:"coffee", name:"Priya Raman", firm:"Bain & Company", role:"Engagement Manager, San Francisco",
  date:"2026-10-02", tab:"debrief", thankYouSent:false, asked:[0,1,2,4],
  profile:"Engagement Manager at Bain SF (4 years). Previously a supply chain analyst at a consumer goods company in Chicago. MBA from a West Coast program. Works mostly in consumer products and retail.",
  goals:"Understand Bain's consumer practice and the SF office culture. Find out whether an analytics background is an advantage. Ideally get a referral for the first round.",
  notes:"Met at a consulting club panel. She mentioned she runs the Bay Area half marathon every year.",
  brief:{
    snapshot:"Priya moved from supply chain analytics into consulting after business school and now leads consumer and retail cases out of Bain SF. Her path is close to yours: analysis first, then strategy.",
    hooks:["You both started in analytical roles before moving toward strategy.","She went through consulting recruiting recently, so she knows the process you're in.","Her supply chain background means she'll understand your operations analytics work without explanation."],
    questions:[
      {q:"What made you move from supply chain into consulting, and what surprised you after you switched?",why:"Opens on her story and mirrors your own pivot."},
      {q:"How much did your analytics background shape the cases you get staffed on?",why:"Tests whether your experience is an asset at Bain."},
      {q:"What does a strong first-year associate do differently on a consumer case?",why:"Shows you're thinking about performing, not just getting in."},
      {q:"How do people in the SF office actually choose their cases?",why:"Gets at staffing culture, which differs by office."},
      {q:"What's a recent consumer or retail problem you found interesting, at a level you can share?",why:"Lets her talk about her work; gives you material for the thank-you."},
      {q:"Looking back at your own recruiting, what would you do differently?",why:"Practical advice she's likely to enjoy giving."},
      {q:"Is there anyone else in the consumer practice you think I should talk to?",why:"Natural lead-in to the ask."}],
    pitch:"I'm a data analyst at a healthcare company, where I've spent three years building the models our operations team uses to plan staffing. I'm moving into consulting because I want to work on business problems end to end, not just the analysis, and Bain's consumer practice is where I'd most like to start.",
    avoid:["Don't ask what Bain does or about salary; she'll read it as no research.","Don't spend more than a minute on your own background unless she asks."],
    ask:"Ask whether she'd be comfortable passing your name to the SF recruiting team for consumer roles."
  },
  transcript:"",
  debrief:{
    summary:"Warm, useful 25-minute chat. Priya connected strongly to your analytics background and offered to introduce you to a partner in the consumer practice.",
    takeaways:["SF consumer practice is growing; most current cases are grocery and consumer goods margin work.","She said people who know where the numbers come from stand out. Use concrete examples from your analytics work in interviews.","Staffing in SF is a mix of preference and availability; first-years get 2-3 consumer cases if they ask early.","Her biggest recruiting regret: practicing cases too late. Start live cases by early November.","Partner to meet: Michael Okafor, consumer practice, former grocery operator."],
    commitments:[{who:"them",what:"Intro you to Michael Okafor",when:"this week"},{who:"me",what:"Send her a one-paragraph summary of your work to forward",when:"within 2 days"}],
    personal:["Training for the SF half marathon in November","Has a new puppy (a corgi)"],
    scorecard:[
      {skill:"Preparation",score:4,evidence:"You referenced her supply chain background in the first two minutes.",tip:"Also skim one recent Bain consumer article so you can react to her case example."},
      {skill:"Question quality",score:4,evidence:"Your question about her background led to her best advice.",tip:"Two questions were close duplicates (culture and staffing). Merge them next time."},
      {skill:"Listening",score:3,evidence:"You talked for roughly 45% of the chat, a bit high for a networking call.",tip:"Aim for 30%. Follow up on her answers before moving to your next question."},
      {skill:"Telling your story",score:4,evidence:"Your 30-second intro was clear and tied your analytics work to consulting.",tip:"Lead with one number (a model's impact, hours saved) to make it stick."},
      {skill:"Closing with an ask",score:5,evidence:"You asked for the referral and got a partner intro instead.",tip:"Keep doing this."}],
    overall:"Strong chat with a real outcome. Talk a little less and you'll be very good at these.",
    thankYou:{subject:"Thank you, and the summary you asked for",body:"Hi Priya,\n\nThank you for making time on Friday. Your point that people who know where the numbers come from stand out changed how I'm thinking about my interview stories.\n\nAs promised, here's a short summary of my work you can forward to Michael: [one paragraph].\n\nGood luck with the half marathon next month, and I hope the corgi is letting you sleep.\n\nBest,\nAlex"},
    followUpDate:"2026-10-20", nextStep:"Send the summary by Sunday, then follow up with Michael Okafor once the intro lands."
  }
};

const EXAMPLE_PEOPLE = [
  {id:"ex-p1", example:true, type:"person", name:"Marcus Lee", firm:"McKinsey & Company", role:"Associate, Los Angeles", industry:"Consulting", tags:["Alumni"], linkedin:"linkedin.com/in/example-marcus",
   remember:["Training for the LA Marathon in March","Offered to run a practice case with you"],
   log:[{id:"exl1",date:"2026-08-28",kind:"Coffee",note:"Talked about case prep and the LA office culture."}],
   howMet:"Alumni mixer in August", metHow:"in_person", notes:"Graduated from your school three years ago. Happy to help with case practice.", lastContact:"2026-08-28", followUp:"2026-10-01"},
  {id:"ex-p2", example:true, type:"person", name:"Jen Ortiz", firm:"Stripe", role:"Product Manager", industry:"Fintech", tags:["Former coworkers"],
   remember:["Has a golden retriever named Waffles"],
   log:[{id:"exl2",date:"2026-10-01",kind:"Call",note:"Caught up about her move into product."}],
   howMet:"Worked together at your first job", metHow:"in_person", notes:"Moved from analytics into product management. Good person to ask about switching careers.", lastContact:"2026-10-01", followUp:""}
];


// ---------- State ----------
let people = [], chats = [];
let db = null, uid = null, sample = null, useLocal = false;
const LS_KEY = "ccc-chats-v1";
const saving = {}, timers = {};
let sel = {type:"home"};          // home | today | add | person{key} | edit{key|null} | conv{id}
let listFilter = "all", groupBy = "az", query = "";
let pending = [];                  // contacts parsed from notes, waiting for review
let draftForm = null;              // the add/edit form's working copy
let snoozeOpen = false;
const busyDraft = new Set();
let currentId = null;              // conversation open in the conversation pane

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ymd = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;   // local date, not UTC
const today = () => ymd(new Date());
const uidGen = () => "c" + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
const keyOf = (name, firm) => (name||"").trim().toLowerCase() + "|" + (firm||"").trim().toLowerCase();
const daysSince = d => d ? Math.floor((Date.now() - new Date(d+"T12:00:00").getTime())/86400000) : null;
const addDays = (n, from) => { const t = new Date((from||today())+"T12:00:00"); t.setDate(t.getDate()+n); return ymd(t); };
const fmtDate = d => { if (!d) return ""; const t = new Date(d+"T12:00:00"); return t.toLocaleDateString(undefined, {month:"short", day:"numeric", year: t.getFullYear() === new Date().getFullYear() ? undefined : "numeric"}); };
const ago = d => { const n = daysSince(d); if (n == null) return ""; if (n <= 0) return "today"; if (n === 1) return "yesterday"; if (n < 60) return n + " days ago"; if (n < 730) return Math.round(n/30) + " months ago"; return Math.round(n/365) + " years ago"; };
const initials = n => (n||"?").trim().split(/\s+/).slice(0,2).map(w => w[0]).join("").toUpperCase() || "?";
const hue = s => { let h = 0; for (const ch of (s||"")) h = (h*31 + ch.charCodeAt(0)) % 360; return h; };
const avatar = (name, lg) => `<span class="av${lg?" lg":""}" style="--h:${hue(name)}" aria-hidden="true">${esc(initials(name))}</span>`;
const CADENCES = [[30,"Every month"],[90,"Every 3 months"],[180,"Every 6 months"],[365,"Once a year"],[0,"Don't remind me"]];
const GROUPS = [["az","A–Z"],["company","Company"],["industry","Industry"],["how","How you met"],["tag","Tag"],["recency","Last contact"]];
const GPREFIX = {company:"co", industry:"ind", how:"met", tag:"tag"};
const RECENCY = ["Last 30 days","1–3 months ago","3–6 months ago","6+ months ago","Never contacted"];
const ICON = {
  msg:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg>',
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>',
  snooze:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2M5 3 2 6M22 6l-3-3"/></svg>',
  prep:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 8h1a4 4 0 0 1 0 8h-1M3 8h14v9a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4z"/><path d="M6 2v2M10 2v2M14 2v2"/></svg>',
  log:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>',
  camera:'<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>',
  edit:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 1 1 3 3L7 19l-4 1 1-4z"/></svg>'
};

// ---------- Persistence ----------
function lsRead(){ try{ return JSON.parse(localStorage.getItem(LS_KEY)||"[]"); }catch{ return []; } }
function lsWrite(){ try{ localStorage.setItem(LS_KEY, JSON.stringify([...chats, ...people, ...(me ? [me] : [])])); }catch{} }
function splitDocs(all){ people = all.filter(x => x.type === "person"); me = all.find(x => x.type === "me") || me; chats = all.filter(x => x.type !== "person" && x.type !== "me"); }
function setSave(t){ const el = $("#saveState"); if (el) el.textContent = t; }
function persist(c, delay=700){
  if (!c || c.example) return;
  c.updatedAt = Date.now();
  clearTimeout(timers[c.id]);
  setSave("Saving…");
  timers[c.id] = setTimeout(() => {
    const body = JSON.parse(JSON.stringify(c));
    if (useLocal || !db || !uid){ lsWrite(); setSave(useLocal ? "Saved on this device" : "Saved"); return; }
    const prev = saving[c.id] || Promise.resolve();
    saving[c.id] = prev.then(() => db.collection("data/users/"+uid).doc(c.id).set(body))
      .then(() => setSave("Saved"))
      .catch(e => setSave(e?.code === "quota_exceeded" ? "Storage full" : "Couldn't save. Try again."));
  }, delay);
}
async function removeDoc(id){
  chats = chats.filter(c => c.id !== id); people = people.filter(c => c.id !== id);
  if (useLocal || !db || !uid) lsWrite();
  else { try{ await db.collection("data/users/"+uid).doc(id).delete(); }catch{} }
}

// ---------- Network model ----------
function buildNetwork(){
  const usingExamples = !people.length && !chats.length;
  const P = usingExamples ? EXAMPLE_PEOPLE : people;
  const C = usingExamples ? [EXAMPLE] : chats;
  const map = new Map(), nameOnly = new Map();
  const blank = o => ({key:"", person:null, name:"", firm:"", role:"", industry:"", howMet:"", tags:[], notes:"", email:"", phone:"", linkedin:"",
    last:"", followUp:"", cadence:90, snoozeUntil:"", draft:null, convs:[], owe:[], owes:[], personal:[], log:[], remember:[], complete:false, example:false, ...o});
  for (const p of P){
    const k = keyOf(p.name, p.firm);
    const log = Array.isArray(p.log) ? p.log : [];
    const lastLog = log.reduce((m, x) => x.date > m ? x.date : m, "");
    map.set(k, blank({key:k, person:p, name:p.name, firm:p.firm||"", role:p.role||"", industry:p.industry||"", howMet:p.howMet||"",
      tags:Array.isArray(p.tags)?p.tags:[], notes:p.notes||"", email:p.email||"", phone:p.phone||"", linkedin:p.linkedin||"",
      last:[p.lastContact||"", lastLog].sort().pop(), followUp:p.followUp||"", cadence:p.cadence ?? 90, snoozeUntil:p.snoozeUntil||"",
      draft:p.draft||null, log, remember:Array.isArray(p.remember)?p.remember:[], owes:(Array.isArray(p.owes)?p.owes:[]).filter(o => !o.done), complete:!!p.complete, example:!!p.example}));
    nameOnly.set((p.name||"").trim().toLowerCase(), k);
  }
  for (const c of C){
    if (!c.name) continue;
    let k = keyOf(c.name, c.firm);
    if (!map.has(k) && nameOnly.has(c.name.trim().toLowerCase())) k = nameOnly.get(c.name.trim().toLowerCase());
    if (!map.has(k)) map.set(k, blank({key:k, name:c.name, firm:c.firm||"", role:c.role||"", example:!!c.example}));
    const e = map.get(k);
    e.convs.push(c);
    if (!e.role && c.role) e.role = c.role;
    if (c.date && c.date > e.last && c.date <= today()) e.last = c.date;
    const d = c.debrief;
    if (d){
      if (d.followUpDate && (!e.followUp || d.followUpDate > e.followUp) && !(e.person?.lastContact && e.person.lastContact >= d.followUpDate)) e.followUp = d.followUpDate;
      const handled = e.last && c.date && e.last > c.date && e.person;
      if (!handled){
        if (!c.thankYouSent) e.owe.push("Thank-you note");
        (d.commitments||[]).filter(m => m.who === "me").forEach(m => e.owe.push(m.what));
      }
      e.personal.push(...(d.personal||[]));
    }
  }
  const list = [...map.values()];
  for (const e of list){
    e.convs.sort((a,b) => (b.date||"").localeCompare(a.date||""));
    e.nudge = reasonsFor(e);
    e.missing = missingOf(e);
  }
  return {list, usingExamples};
}
function missingOf(e){
  if (e.example || !e.person || e.complete) return [];
  const m = [];
  if (!e.firm) m.push("company"); if (!e.role) m.push("role"); if (!e.linkedin) m.push("LinkedIn");
  return m;
}
function addLog(p, entry){
  const x = {id:"l"+uidGen(), date:entry.date || today(), kind:entry.kind || "Talked", note:(entry.note||"").trim()};
  p.log = [...(Array.isArray(p.log) ? p.log : []), x];
  if (x.date > (p.lastContact||"")) p.lastContact = x.date;
  if (p.followUp && p.followUp <= x.date) p.followUp = "";
  p.snoozeUntil = ""; p.draft = null;
  return x;
}
function linkedinSearch(e){
  const kw = [e.name, e.firm || e.howMet].filter(Boolean).join(" ");
  return "https://www.linkedin.com/search/results/people/?keywords=" + encodeURIComponent(kw);
}
// Apply new identity fields; keep conversations attached when the name or company changes
function applyIdentity(e, fields){
  const p = ensurePerson(e);
  const newName = fields.name ?? p.name, newFirm = fields.firm ?? p.firm;
  if (keyOf(newName, newFirm) !== e.key) e.convs.forEach(c => { if (!c.example){ c.name = newName; c.firm = newFirm; persist(c, 0); } });
  Object.assign(p, fields);
  return keyOf(p.name, p.firm);
}
const LOG_KINDS = ["Talked","Coffee","Call","Text","Email","Met at event","Reached out"];

// How you met decides what you owe them. "days" = when the follow-up is due.
const MEET = {
  in_person: {label:"In person", kind:"Met in person", owe:"Send a nice-to-meet-you email", days:1, hint:"You'll get a reminder to send a nice-to-meet-you email tomorrow."},
  video:     {label:"Video call", kind:"Video call", owe:"Send a thank-you note", days:1, hint:"You'll get a reminder to send a thank-you note tomorrow."},
  intro:     {label:"Introduced", kind:"Introduced", owe:"Reply to the intro and thank whoever introduced you", days:1, hint:"You'll get a reminder to reply to the intro tomorrow."},
  online:    {label:"Online", kind:"Connected online", owe:"", days:0, hint:"No follow-up owed. You'll just get the usual stay-in-touch reminder."},
};
// Log kinds that usually mean you owe a thank-you, and kinds that count as following up
const OWE_ON_LOG = {"Coffee":"Send a thank-you note", "Call":"Send a thank-you note", "Met in person":"Send a nice-to-meet-you email", "Video call":"Send a thank-you note"};
const FOLLOWUP_KINDS = new Set(["Email","Text","Reached out","Message"]);
function addOwe(p, what, days, auto){ if (auto && (p.owes||[]).some(o => o.auto && !o.done)) return;   // one automatic follow-up at a time
  p.owes = [...(Array.isArray(p.owes) ? p.owes : []), {id:"o"+uidGen(), what, due:addDays(days||0), done:false, auto:!!auto}]; }
function resolveAutoOwes(p){ (p.owes||[]).forEach(o => { if (!o.done && o.auto){ o.done = true; o.doneOn = today(); } }); }
const dueLabel = d => { const n = daysSince(d); if (n == null) return ""; if (n > 0) return `overdue by ${n} day${n>1?"s":""}`; if (n === 0) return "due today"; if (n === -1) return "due tomorrow"; return "due " + fmtDate(d); };
function reasonsFor(e){
  const r = []; let score = 0, cal = null;
  for (const c of calReasonsFor(e)){ r.push(c.text); score += c.score; if (!cal) cal = c; }   // meetings: prep before, debrief after
  for (const o of e.owes){ r.push(`${o.what} (${dueLabel(o.due)})`); score += 3 + Math.max(0, Math.min(daysSince(o.due), 14))/7; }
  if (e.snoozeUntil && e.snoozeUntil > today()) return r.length ? {r, score, cal} : null;   // snooze hides reminders, not promises
  if (e.owe.length){ r.push("You owe them: " + e.owe.join("; ")); score += 3; }
  if (e.followUp && e.followUp <= today()){ r.push(`You planned to follow up by ${fmtDate(e.followUp)}`); score += 2 + Math.min(daysSince(e.followUp), 30)/30; }
  const ds = daysSince(e.last);
  if (e.cadence > 0 && ds != null && ds >= e.cadence){ r.push(`You last talked ${ago(e.last)}`); score += 1 + Math.min(ds/e.cadence, 3)/3; }
  return r.length ? {r, score, cal} : null;
}

function groupsOf(e){
  switch (groupBy){
    case "company": return [e.firm || "No company"];
    case "industry": return [e.industry || "No industry"];
    case "how": return [e.howMet || "Not noted"];
    case "tag": return e.tags.length ? e.tags : ["No tag"];
    case "recency": { const d = daysSince(e.last); return [d==null ? RECENCY[4] : d<=30 ? RECENCY[0] : d<=90 ? RECENCY[1] : d<=180 ? RECENCY[2] : RECENCY[3]]; }
    default: { const ch = (e.name||"#").trim()[0]?.toUpperCase() || "#"; return [/[A-Z]/.test(ch) ? ch : "#"]; }
  }
}
function ensurePerson(e){
  if (e.person) return e.person;
  const p = {id:"p"+uidGen(), type:"person", name:e.name, firm:e.firm, role:e.role, industry:"", howMet:"", tags:[], notes:"",
    lastContact:"", followUp:"", cadence:90, snoozeUntil:""};
  people.push(p); e.person = p; return p;
}
function findEntry(key){ return buildNetwork().list.find(e => e.key === key); }

// ---------- Render shell ----------
function render(){
  renderSide(); renderMain();
  document.body.dataset.pane = sel.type === "home" ? "list" : "detail";
}
const renderList = () => renderSide();
const renderChat = () => renderMain();
const renderAll = () => render();

function renderMain(){
  const m = $("#main");
  const t = sel.type === "home" ? "today" : sel.type;
  if (t === "today") return renderToday(m);
  if (t === "add") return renderAdd(m);
  if (t === "edit") return renderEdit(m);
  if (t === "conv") return renderConv(m);
  if (t === "find") return renderFind(m);
  if (t === "me") return renderMe(m);
  if (t === "group") return renderGroup(m);
  if (t === "person"){
    const e = findEntry(sel.key);
    if (!e){ sel = {type:"home"}; return renderToday(m); }
    return renderPerson(m, e);
  }
}

// ---------- Add (one box: a name, a sentence, or a photo) ----------
let quickContext = "";          // "Where": remembered so you can add a whole event quickly
let quickMet = "in_person", capU = "aq";
// Decides whether typed text is just a name (save instantly) or a description (send to the AI).
// Evaluated on a held-out set: see docs/evaluation.md. Uses general signal words, never company names,
// and sends 3-4 plain words to the AI because "Rachel Green Ralph Lauren" and "Maria del Carmen Ruiz" look alike to rules.
const NAME_STOP = new Set(["met","meet","at","from","with","and","the","a","an","had","have","coffee","call","called","talked","talk","she","he","they","her","his","is","was","works","work","to","for","today","yesterday","who","we","i","my","about","in","on","said","follow","up"]);
const SIGNAL_WORDS = new Set([...NAME_STOP,"w","re","via","by","into","of","lunch","dinner","drinks","breakfast","zoom","chat","chatted","spoke","speak","bumped","ran","saw","emailed","email","texted","text","dm","dmed","messaged","intro","introduced","ping","pinged","reach","reached","mixer","event","panel","conference","club","recruiter","recruiting","ceo","cto","cfo","coo","vp","svp","evp","pm","apm","founder","cofounder","manager","director","partner","principal","analyst","associate","consultant","engineer","designer","ae","se","sdr","intern","mba","professor","prof","product","sales","marketing","tomorrow","tonight","next","week","again","asked"]);
const NAME_PARTICLES = new Set(["van","von","der","den","de","da","del","della","di","du","la","le","st","st.","bin","al","ibn","jr","jr.","sr","sr.","ii","iii","ní","nic","mac","o"]);
function routeCapture(t){
  const s = t.trim(); if (!s) return "empty";
  const w = s.split(/\s+/);
  if (/[0-9@,;:!?()&/+]|\s[-–—]\s/.test(s)) return "ai";
  if (!w.every(x => /^[\p{L}][\p{L}'’.-]*$/u.test(x))) return "ai";
  if (w.some(x => SIGNAL_WORDS.has(x.toLowerCase().replace(/\.$/, "")))) return "ai";
  if (w.length <= 2) return "name";
  if (w.length <= 4 && w.slice(1, -1).some(x => NAME_PARTICLES.has(x.toLowerCase()))) return "name";
  if (w.length <= 4 && NAME_PARTICLES.has(w.at(-1).toLowerCase())) return "name";
  return "ai";
}
// Without AI (e.g. a copy with no API key), any short run of plain words is treated as a name.
const plainWords = t => { const w = t.trim().split(/\s+/); return w.length <= 4 && routeCapture(t) !== "empty" && !/[0-9@,;:!?()&/+]/.test(t) && w.every(x => /^[\p{L}][\p{L}'’.-]*$/u.test(x) && !SIGNAL_WORDS.has(x.toLowerCase().replace(/\.$/, ""))); };
function isJustName(t){ const r = routeCapture(t); return r === "name" || (r === "ai" && !sample && plainWords(t)); }

}
function bindCapture(u){
  capU = u;
  const box = $("#"+u+"-in"), ctx = $("#"+u+"-ctx"), st = $("#"+u+"-st");
  try{ box.value = sessionStorage.getItem("nw-qa") || ""; }catch{}
  box.oninput = () => { try{ sessionStorage.setItem("nw-qa", box.value); }catch{} };
  ctx.value = quickContext;
  ctx.oninput = () => { quickContext = ctx.value.trim(); };
  document.querySelectorAll(`#${u}-met .chip`).forEach(b => b.onclick = () => {
    quickMet = b.dataset.met;
    document.querySelectorAll(`#${u}-met .chip`).forEach(x => x.setAttribute("aria-pressed", x === b));
    st.className = "status"; st.textContent = MEET[quickMet].hint;
  });
  $("#"+u+"-go").onclick = () => runCapture(u);

  $("#"+u+"-imp").onclick = () => go({type:"add", mode:"import"});
  drawPending();
}

async function runCapture(u){
  const box = $("#"+u+"-in"), st = $("#"+u+"-st"), btn = $("#"+u+"-go");
  const text = box.value.trim();
  quickContext = $("#"+u+"-ctx").value.trim();
  if (!text){ st.className = "status err"; st.textContent = "Type a name or describe who you met."; box.focus(); return; }
  const {list} = buildNetwork();
  const real = list.filter(e => !e.example);
  // Just a name: save right away, no AI needed
  if (isJustName(text) || !sample){
    if (!isJustName(text)){ st.className = "status err"; st.textContent = "Describing people needs AI, which isn't available here. Type just their name, or use Fill in every field."; return; }
    const same = real.find(e => e.name.toLowerCase() === text.toLowerCase());
    if (same){
      st.className = "status";
      st.innerHTML = `${esc(same.name)} is already in your contacts. <button class="linkish" id="${u}-open">Open their card</button> to log a conversation.`;
      $("#"+u+"-open").onclick = () => go({type:"person", key:same.key}); return;
    }
    const p = savePerson({name:text, howMet:quickContext, metHow:quickMet, lastContact:today(), cadence:90}, null, false, u+"-st");
    if (!p) return;
    box.value = ""; try{ sessionStorage.removeItem("nw-qa"); }catch{}
    renderSide(); box.focus();
    const e = findEntry(keyOf(p.name, p.firm));
    st.className = "status";
    st.innerHTML = `Saved <button class="linkish" id="${u}-open">${esc(p.name)}</button> · <button class="linkish" id="${u}-undo">Undo</button> · <a href="${esc(linkedinSearch(e))}" target="_blank" rel="noopener">Find on LinkedIn</a>${quickContext ? ` · Add the next person from ${esc(quickContext)}` : ""}`;
    $("#"+u+"-undo").onclick = async () => { await removeDoc(p.id); renderSide(); box.value = text; st.className = "status"; st.textContent = `Removed ${p.name}. Add a little more detail, like “${p.name.split(" ")[0]} from …”, and press Add.`; box.focus(); };
    $("#"+u+"-open").onclick = () => go({type:"person", key:keyOf(p.name, p.firm)});
    return;
  }
  // A sentence: the AI picks out each person, and spots people already in contacts
  btn.disabled = true; st.className = "status"; st.textContent = "Reading…";
  const known = real.map(e => `- ${e.name} (${e.firm||"no company"})`).join("\n");
  const prompt = `Turn this note into contact records for a personal networking tracker. The note may describe meeting new people, or talking to people already in the user's contacts, or both. Today is ${today()}. Resolve relative dates ("next week", "last Tuesday") to YYYY-MM-DD. Use only what the note says; leave a field "" when it isn't mentioned. Industry may be inferred from a well-known company. Tags are 1-3 short labels for the context (an event, school, club, or group).
If someone clearly matches a person in the existing contacts list, use that exact name and company and set "existing": true, and set "kind" to what happened ("Coffee", "Call", "Message", "Video call", "Met in person", or "Talked").

Reply with only JSON: {"people": [{"existing": false, "kind": "", "name": "", "firm": "", "role": "", "industry": "", "email": "", "phone": "", "howMet": "short, where they met", "metHow": "in_person" | "video" | "intro" | "online" | "", "introducedBy": "", "tags": [], "notes": "1-2 sentences of professional details or what was discussed", "remember": ["personal details worth remembering: family, hobbies, plans, what they asked for"], "lastContact": "YYYY-MM-DD, default today", "followUp": "YYYY-MM-DD or empty"}]}
metHow: "in_person" for face to face, "video" for a video call, "intro" if someone introduced them, "online" for LinkedIn or other online-only contact, "" if unclear.

EXISTING CONTACTS:
${known || "(none)"}

${quickContext ? `WHERE (the user typed this separately): ${quickContext}\n\n` : ""}NOTE:
${text}`;
  try{
    const r = await sample.json(prompt, {modelTier:"quick"});
    const ppl = (r?.people||[]).filter(p => p && p.name);
    if (!ppl.length) throw {code:"invalid_json"};
    for (const p of ppl.reverse()){
      const match = real.find(e => keyOf(e.name,e.firm) === keyOf(p.name,p.firm)) || (p.existing ? real.find(e => e.name.toLowerCase() === String(p.name).toLowerCase()) : null);
      const unsure = (Array.isArray(p.unsure) ? p.unsure : []).filter(f => ["name","firm","email","phone","linkedin"].includes(f) && (f === "name" || String(p[f]||"").trim()));
      pending.unshift({uid:uidGen(), matchKey: match?.key || null, unsure, data:{...p,
        firm: match ? match.firm : p.firm, howMet: p.howMet || quickContext, lastContact: p.lastContact || today(), metHow: MEET[p.metHow] ? p.metHow : quickMet,
        notes:[p.notes, p.introducedBy ? `Introduced by ${p.introducedBy}.` : ""].filter(Boolean).join(" "),
        tags:Array.isArray(p.tags)?p.tags:[], cadence:match?.cadence ?? 90}});
    }
    st.textContent = ppl.length === 1 ? "Check the details, then save." : `Found ${ppl.length} people. Check the details, then save.`;
    drawPending();
  }catch(e){ st.className = "status err"; st.textContent = e?.code === "invalid_json" ? "Couldn't find anyone in that. Include at least a name." : errCopy(e); }
  finally{ btn.disabled = false; }
}

// A photo of a sign-up sheet, business card, name tags, or attendee list
// The photo step, kept in one place so eval/photo-run.js tests exactly what the app runs.
const PHOTO_PROMPT = `The user took this photo to add people to their networking contacts. It may show a sign-up sheet, attendee list, business card(s), name tags, or a slide with names. Extract every person whose name you can read clearly.
Rules: include only names you can actually read, and skip rows you can't read rather than guessing. Never invent a company, role, or email; leave a field "" when it isn't written. If the page shows an event name or title, put it in "event".
For each person, list in "unsure" every field ("name", "firm", "email", "phone", "linkedin") where you are not certain of every character: blurry, smudged, cut off, or partly inferred. Be strict when the photo is blurry or dark: a flagged field costs the user a glance, a wrong email costs them a bounced message.
Reply with only JSON: {"event": "", "unreadable": 0, "people": [{"name": "", "firm": "", "role": "", "email": "", "phone": "", "linkedin": "", "notes": "anything else written next to them", "unsure": []}]}`;
async function extractPhoto(file){ return sample.json(PHOTO_PROMPT, {images:file}); }
async function runPhoto(u, file){
  const st = $("#"+u+"-st");
  quickContext = $("#"+u+"-ctx").value.trim();
  if (!sample){ st.className = "status err"; st.textContent = "Reading photos needs AI, which isn't available here."; return; }
  const lim = await (sample.limits ? sample.limits() : Promise.resolve(null)).catch(() => null);
  if (!lim?.images){ st.className = "status err"; st.textContent = "Photos can't be read in this view. Type the names instead."; return; }
  st.className = "status"; st.textContent = "Reading the photo… (this can take up to a minute)";
  const {list} = buildNetwork();
  const real = list.filter(e => !e.example);
  try{
    const r = await extractPhoto(file);
    const ppl = (r?.people||[]).filter(p => p && String(p.name||"").trim());
    if (!ppl.length){ st.className = "status err"; st.textContent = "Couldn't read any names in that photo. Try a sharper, closer photo with good light."; return; }
    const where = quickContext || String(r.event || "").trim();
    const group = ppl.length > 5;
    for (const p of ppl.reverse()){
      const match = real.find(e => keyOf(e.name,e.firm) === keyOf(p.name,p.firm)) || real.find(e => e.name.toLowerCase() === String(p.name).trim().toLowerCase() && !p.firm);
      const unsure = (Array.isArray(p.unsure) ? p.unsure : []).filter(f => ["name","firm","email","phone","linkedin"].includes(f) && (f === "name" || String(p[f]||"").trim()));
      pending.unshift({uid:uidGen(), matchKey: match?.key || null, unsure, data:{...p, name:String(p.name).trim(), firm: match && !p.firm ? match.firm : (p.firm||""),
        howMet: where, metHow: quickMet, tags: [], cadence: 90, lastContact: today(), oweFollowUp: !group}});
    }
    const bad = Number(r.unreadable) || 0;
    const nUnsure = pending.filter(it => it.unsure?.length).length;
    st.textContent = `Found ${ppl.length} ${ppl.length === 1 ? "person" : "people"}${where ? ` from ${where}` : ""}${bad ? ` (${bad} row${bad>1?"s were":" was"} too hard to read)` : ""}. Check them, then save.`
      + (nUnsure ? ` ${nUnsure} ${nUnsure === 1 ? "is" : "are"} marked “Hard to read”: check ${nUnsure === 1 ? "it" : "those"} against the photo.` : "")
      + (group ? " Follow-up reminders are off for a group this size so your to-do list doesn't fill up; use Group email to write to everyone at once." : "");
    drawPending();
  }catch(e){
    st.className = "status err";
    st.textContent = e?.code === "image_rejected" ? "That photo couldn't be used. Try a JPEG or PNG under 20 MB." : e?.code === "invalid_json" ? "Couldn't read that photo. Try again with a sharper photo." : errCopy(e);
  }
}

        <button class="btn small" data-discard="${it.uid}">Discard</button><span class="status" id="${it.uid}-st"></span></div></div>`; }).join("")}`;

    sa.disabled = true; let last, n = 0; const saved = [];
    for (const it of [...pending]){ const p = savePerson(it.data, it.matchKey, false, it.uid+"-st", true); if (p){ last = p; n++; saved.push(p); pending = pending.filter(x => x !== it); } }
    await persistMany(saved, null);
    if (last) afterPendingSave(last, n);
  };
  const da = $("#discardAll"); if (da) da.onclick = () => { pending = []; drawPending(); };
}

// Create or update a person record from form data. replaceAll = true for the edit form.
function savePerson(d, matchKey, replaceAll, statusId, noPersist){
  if (!d.name?.trim()){ const st = document.getElementById(statusId); if (st){ st.className = "status err"; st.textContent = "Add a name."; } return null; }
  const {list} = buildNetwork();
  const e = list.find(x => !x.example && (x.key === matchKey || (!replaceAll && keyOf(x.name,x.firm) === keyOf(d.name,d.firm))));
  const clean = {name:d.name.trim(), firm:(d.firm||"").trim(), role:d.role||"", industry:d.industry||"", howMet:d.howMet||"",
    email:d.email||"", phone:d.phone||"", linkedin:d.linkedin||"", tags:d.tags||[], notes:d.notes||"",
    lastContact:d.lastContact||"", followUp:d.followUp||"", cadence:Number(d.cadence ?? 90), metHow:d.metHow||""};
  let p;
  if (e){
    p = ensurePerson(e);
    if (replaceAll){
      // keep conversations attached if the name or company changed
      if (keyOf(clean.name, clean.firm) !== e.key) e.convs.forEach(c => { if (!c.example){ c.name = clean.name; c.firm = clean.firm; persist(c, 0); } });
      Object.assign(p, clean);
    } else {
      for (const k of ["role","industry","howMet","followUp","email","phone","linkedin"]) if (clean[k]) p[k] = clean[k];
      p.tags = [...new Set([...(p.tags||[]), ...clean.tags])];
      if (clean.notes) p.notes = p.notes ? `${p.notes}\n${fmtDate(clean.lastContact||today())}: ${clean.notes}` : clean.notes;
      const kind = d.kind || "Talked";
      if (clean.lastContact) addLog(p, {date:clean.lastContact, kind, note:clean.notes});
      if (FOLLOWUP_KINDS.has(kind)) resolveAutoOwes(p);
      if (OWE_ON_LOG[kind] && d.oweFollowUp !== false) addOwe(p, OWE_ON_LOG[kind], Math.max(0, 1 - (daysSince(clean.lastContact || today())||0)), true);
      if (Array.isArray(d.remember) && d.remember.length) p.remember = [...new Set([...(p.remember||[]), ...d.remember.filter(Boolean)])];
    }
  } else {
    p = {id:"p"+uidGen(), type:"person", ...clean, snoozeUntil:"", createdAt:Date.now(), remember:Array.isArray(d.remember) ? d.remember.filter(Boolean) : [], log:[]};
    const mh = MEET[d.metHow] || null;
    p.metHow = d.metHow || "";
    if (clean.lastContact) addLog(p, {date:clean.lastContact, kind: mh ? mh.kind : (clean.howMet ? "Met in person" : "Talked"), note: clean.howMet ? ((!mh || mh === MEET.in_person) ? "Met at " + clean.howMet : clean.howMet) : ""});
    if (mh?.owe && d.oweFollowUp !== false && (daysSince(clean.lastContact || today()) ?? 0) <= 7) addOwe(p, mh.owe, Math.max(0, mh.days - (daysSince(clean.lastContact || today()) || 0)), true);
    people.push(p);
  }
  if (!noPersist) persist(p, 0);
  return p;
}

// ---------- Get an intro (find people + who could introduce you + draft the ask) ----------
let findQuery = "", findResult = null, findBusy = false;
const introState = new Map();      // contact key -> {busy, draft, note, sent}
const FIND_STOP = new Set([...NAME_STOP, "do","know","anyone","someone","somebody","people","person","want","wanna","meet","get","intro","introduction","into","can","could","me","whos","works","working","any","there","contacts","contact","network","find","like","be","introduced","connect","help","them","someone's","who's","does","which","of","or","should","would","talk"]);
const stemW = w => (w.length > 3 && w.endsWith("s") && !w.endsWith("ss")) ? w.slice(0, -1) : w;
const wordsOf = s => new Set(String(s||"").toLowerCase().split(/[^\p{L}\p{N}&]+/u).filter(Boolean).map(stemW));
function findTerms(q){ return [...new Set(String(q||"").toLowerCase().split(/[^\p{L}\p{N}&]+/u).filter(w => w.length > 1 && !FIND_STOP.has(w)).map(stemW))]; }
function introTopic(q){
  const t = String(q||"").trim().replace(/[?.!]+$/, "")
    .replace(/^(who (do|does) (i|we) know|do i know anyone|i want to meet|i'd like to meet|help me meet|get (me )?an intro(duction)? to|find|anyone|someone|somebody|people)\s*/i, "").trim();
  return t || String(q||"").trim();
}
// Instant, no-AI matching: a contact "matches" when a search word is in their company; they "could introduce you"
// when the word shows up in their role, industry, notes, tags, or how you met (they know the space or the people).
function localFind(q, list){
  const terms = findTerms(q); if (!terms.length) return {matches:[], introducers:[]};
  const matches = [], introducers = [];
  for (const e of list){
    const firm = wordsOf(e.firm);
    const fields = [["role", e.role], ["industry", e.industry], ["notes", e.notes], ["how you met", e.howMet], ["tags", (e.tags||[]).join(" ")], ["what you remember", (e.remember||[]).join(" ")]];
    const firmHits = terms.filter(t => firm.has(t));
    const otherHits = fields.filter(([, v]) => terms.some(t => wordsOf(v).has(t)));
    if (firmHits.length) matches.push({key:e.key, score:firmHits.length * 2 + otherHits.length, why:`Works at ${e.firm}`});
    else if (otherHits.length){
      const hitWords = terms.filter(t => fields.some(([, v]) => wordsOf(v).has(t)));
      if (hitWords.length >= Math.min(terms.length, 2) || terms.length === 1)
        introducers.push({key:e.key, score:hitWords.length, why:`“${hitWords.join(", ")}” is in their ${otherHits.map(x => x[0]).join(" and ")}`});
    }
  }
  const by = (a, b) => b.score - a.score;
  return {matches:matches.sort(by).slice(0, 8), introducers:introducers.sort(by).slice(0, 4), local:true};
}

      <span class="status" id="findSt">${sample ? "" : "Quick search only here (AI search isn't available)."}</span>
      ${usingExamples ? `<p class="hint">You're searching the example contacts. Once you add your own, it searches yours.</p>` : ""}

const drawFindNow = () => { if (sel.type === "find") drawFind(buildNetwork().list); };
function drawFind(list){
  const out = $("#findOut"); if (!out) return;
  if (!findQuery){ out.innerHTML = ""; return; }
  const ai = findResult && findResult.q === findQuery ? findResult.data : null;
  const loc = localFind(findQuery, list);
  const byKey = new Map(list.map(e => [e.key, e]));
  // AI result when we have it; quick matches it missed are kept so nothing obvious disappears
  const merge = (a, b) => { const seen = new Set(); return [...(a||[]), ...(b||[])].filter(x => x && byKey.has(x.key) && !seen.has(x.key) && seen.add(x.key)); };
  const matches = ai ? merge(ai.matches, loc.matches) : loc.matches;
  const mk = new Set(matches.map(x => x.key));
  const intros = (ai ? merge(ai.introducers, loc.introducers) : loc.introducers).filter(x => !mk.has(x.key)).slice(0, 5);
  const topic = introTopic(findQuery);
  const row = (x, direct) => { const e = byKey.get(x.key); const st = introState.get(e.key);
    return `<div class="find-row"><div class="todo">

const introPhrase = t => /^(at|in|from|with)\b/i.test(t) ? "someone " + t : t;
function introTemplate(e, topic, direct){
  const f = e.name.split(" ")[0], t = /^(at|in|from|who|with)\b/i.test(topic) ? topic : "in " + topic;
  const body = direct
    ? `Hi ${f},\n\nHope you're doing well. I'm exploring roles ${t} and you were the first person I thought of. Would you have 15 minutes to tell me about your team? And if there's someone else you think I should talk to, I'd be grateful for an intro.\n\nThanks so much,\n${meFirst() || "[Your name]"}`
    : `Hi ${f},\n\nHope you're doing well. I'm hoping to talk with someone ${t}, and I thought you might know the right person. Would you be open to introducing me? I'm happy to send a short note you can forward so it's no work on your end.\n\nThanks so much,\n${meFirst() || "[Your name]"}`;
  return {channel:"Message", subject:"", message:body};
}
async function draftIntro(e, direct){
  const topic = introTopic(findQuery);
  const st = {busy:true}; introState.set(e.key, st); drawFindNow();
  if (!sample){ st.draft = introTemplate(e, topic, direct); st.note = "starter template"; st.busy = false; drawFindNow(); return; }
  const prompt = `The user wants to meet: "${findQuery}". Write a short message the user can send to someone they already know, asking for help.
${direct
  ? `This contact works at or fits what the user is looking for. Ask for a short chat about their work, and, if natural, whether they'd introduce the user to the right person on their team.`
  : `This contact doesn't fit directly but may know the right people. Ask whether they'd be open to introducing the user to someone who fits. Make it easy to say yes or no.`}
Rules: under 110 words. Open with something specific to this contact (a shared history, something they said, a personal detail), never "I hope this finds you well". Say in one sentence why the user wants this. One clear ask. Then, on its own after a blank line, add "Here's a short note you can forward:" and a 2-sentence blurb about the user in the third person, only for intro requests. No flattery. Sign with ${meFirst() || "[Your name]"}. Use only details given below; never invent facts about the user or the contact.

Reply with only JSON: {"channel": "Text" | "LinkedIn" | "Email", "subject": "email subject or empty", "message": "the message"}

${meText()}

CONTACT: ${e.name}, ${e.role||""}${e.firm?" at "+e.firm:""}${e.industry?" ("+e.industry+")":""}
HOW THEY MET: ${e.howMet||"(not noted)"}
NOTES: ${e.notes||"(none)"}
PERSONAL DETAILS: ${[...(e.remember||[]), ...(e.personal||[])].join(", ")||"(none)"}
LAST CONTACT: ${e.last||"(unknown)"}`;
  try{
    const r = await sample.json(prompt, {cache:false});
    if (!r?.message) throw {code:"invalid_json"};
    st.draft = {channel:r.channel||"Message", subject:r.subject||"", message:r.message};
  }catch(err){ st.draft = introTemplate(e, topic, direct); st.note = "AI unavailable, starter template"; }
  st.busy = false; drawFindNow();
}
async function runFind(){
  const {list} = buildNetwork();
  findBusy = true; renderMain();
  const q = findQuery;
  const lines = list.slice(0, 400).map(e => [
    `key=${e.key}`, e.name, e.role, e.firm, e.industry, e.howMet && "met: " + e.howMet, e.tags.length && "tags: " + e.tags.join(", "),
    e.notes && "notes: " + e.notes.replace(/\s+/g, " ").slice(0, 300),
    (e.remember.length || e.personal.length) && "remember: " + [...e.remember, ...e.personal].join("; ").slice(0, 200),
    e.log.length && "history: " + e.log.slice(-3).map(x => x.note).filter(Boolean).join("; ").slice(0, 200)
  ].filter(Boolean).join(" | ")).join("\n");
  const prompt = `You help the user find people in their network and get warm introductions.

${meText()}

THE USER WANTS TO MEET: ${q}

THEIR CONTACTS (one per line; the key= value identifies each):
${lines || "(no contacts yet)"}

Do three things:
1. "matches": contacts who directly fit (e.g. work at the company named, or have the role asked about). Only real fits based on the details given; never guess. Up to 8, best first, each with a "why" of at most 12 words (e.g. "Associate at McKinsey; offered to run a practice case").
2. "introducers": contacts who don't fit directly but could plausibly introduce the user to someone who does: same industry, worked there before, the notes say they know people there, or a strong connector (alumni, mentor). Up to 4, each with a "why" of at most 12 words naming the specific reason. Empty if none. Never put brackets, placeholders, or instructions to the user in a "why".
3. Searches for finding NEW people: "linkedin" is 2-3 LinkedIn people-search keyword strings (plain keywords like "Bain San Francisco Stanford", no quotes or operators; when the request says "my school" or "alumni", use the school from the user's profile), each with a short "label". "google" is 1-2 Google queries that search LinkedIn profiles, using site:linkedin.com/in and quoted terms, each with a short "label".
Add a one-sentence "tip" on how to reach out to people found this way.

Reply with only JSON: {"matches": [{"key": "", "why": ""}], "introducers": [{"key": "", "why": ""}], "linkedin": [{"label": "", "keywords": ""}], "google": [{"label": "", "query": ""}], "tip": ""}`;
  try{
    const data = await sample.json(prompt);
    if (q === findQuery) findResult = {q, data};
    findBusy = false;
    if (sel.type === "find") renderMain();
  }catch(err){
    findBusy = false;
    if (sel.type === "find"){ renderMain(); const s2 = $("#findSt"); if (s2){ s2.className = "status err"; s2.textContent = "AI search didn't work, so these are quick matches. " + errCopy(err); } }
  }
}
